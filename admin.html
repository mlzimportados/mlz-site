<!doctype html>
<html lang="pt-BR">
<head>
<script>/* endereço oficial: mlzcompany.com */(function(l){if(/workers\.dev$|^www\./.test(l.hostname))l.replace("https://mlzcompany.com"+l.pathname+l.search+l.hash)})(location)</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel MLZ</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1d33">
<link rel="icon" href="img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#07111f}
:root{--bg:#07111f;--side:#0a1728;--panel:rgba(255,255,255,.035);--panel-s:#0d1c30;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --gold:#d9b24c;--gold-hi:#f1d68a;--txt:#f2f4f8;--muted:rgba(226,232,242,.62);--faint:rgba(226,232,242,.4);--navy:#0b1a2e;--gline:rgba(217,178,76,.3);
  --ok:#4cc38a;--okbg:rgba(76,195,138,.12);--bad:#ef6b5b;--badbg:rgba(239,107,91,.12);--wait:#8fa1b6;--waitbg:rgba(143,161,182,.1);--warn:#e9b44c;
  --hd:Montserrat,system-ui,sans-serif}
body{font-family:Outfit,system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(700px 500px at 50% 0%,rgba(40,84,140,.35),transparent 70%)}
.lbox{width:100%;max-width:380px;padding:40px 28px 32px;border-radius:22px;background:var(--panel-s);border:1px solid var(--line);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.lbox img{height:22px;margin:0 auto 26px;display:block}
.lbox h1{font-family:var(--hd);font-size:19px;font-weight:600;margin-bottom:6px}
.lbox p{color:var(--muted);font-size:14px;margin-bottom:26px}
.lbox form{display:grid;gap:14px;text-align:left}
.lbox .btn{margin-top:4px;height:48px}
.erro{color:var(--bad);font-size:13.5px;min-height:18px}

/* campos */
label.f{display:grid;gap:6px;font-size:12.5px;color:var(--muted);font-weight:500}
.in{width:100%;height:44px;padding:0 13px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line2);outline:0;font-size:16px;color:var(--txt);transition:border-color .15s}
textarea.in{height:auto;min-height:84px;padding:11px 13px;resize:vertical;line-height:1.45}
.in:focus{border-color:var(--gold);background:rgba(255,255,255,.06)}
.in::placeholder{color:var(--faint)}
select.in option{background:#0d1c30}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;font-weight:500;font-size:14.5px;white-space:nowrap;transition:.15s}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.gold:hover{background:var(--gold-hi)}
.btn.line{border:1px solid var(--line2)}
.btn.line:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.03)}
.btn.red{color:var(--bad);border:1px solid rgba(239,107,91,.3)}
.btn.red:hover{background:var(--badbg)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.grid2{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}}

/* casca do app: menu lateral */
#app{min-height:100vh}
.side{position:fixed;left:0;top:0;bottom:0;width:236px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:26px 16px 20px;z-index:30}
.side .logo{height:19px;margin:0 10px 34px;align-self:flex-start}
.side .lbl{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);margin:0 12px 10px}
nav.tabs{display:flex;flex-direction:column;gap:2px}
nav.tabs button{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:10px;color:var(--muted);font-size:14.5px;font-weight:500;text-align:left;transition:.15s}
nav.tabs button:hover{color:var(--txt);background:rgba(255,255,255,.03)}
nav.tabs button.on{background:rgba(217,178,76,.1);color:var(--gold-hi)}
nav.tabs button.on svg{color:var(--gold)}
nav.tabs button{position:relative}
.nb{font-style:normal;margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--gold);color:#0b1a2e;font-size:11px;font-weight:600;display:grid;place-items:center}
.nb:empty{display:none}
.tl{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.tl span b{color:var(--txt);font-weight:500}
.tl .no{color:var(--faint)}
.eits{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
.sidefoot{margin-top:auto;display:grid;gap:2px;border-top:1px solid var(--line);padding-top:14px}
.sidefoot a,.sidefoot button{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;color:var(--muted);font-size:14px}
.sidefoot a:hover,.sidefoot button:hover{color:var(--txt);background:rgba(255,255,255,.03)}
.topm{display:none}
main{margin-left:236px;padding:38px 44px 60px;max-width:1236px}
@media(max-width:900px){
  .side{position:static;width:auto;height:auto;padding:0;border:0;background:none}
  .side .logo,.side .lbl,.sidefoot{display:none}
  .topm{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;height:58px;padding:0 16px;background:rgba(7,17,31,.96);border-bottom:1px solid var(--line)}
  .topm img{height:17px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;flex-direction:row;background:rgba(10,23,40,.98);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav.tabs button{flex:1;flex-direction:column;gap:4px;height:auto;padding:7px 2px;font-size:10.5px;justify-content:center}
  nav.tabs button svg{width:21px;height:21px}
  nav.tabs button.on{background:none}
  .nb{position:absolute;top:2px;left:calc(50% + 5px);margin:0;min-width:16px;height:16px;font-size:9.5px;padding:0 4px}
  main{margin:0;padding:22px 16px 100px}
}

/* cabeçalho de página */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
h2.t{font-family:var(--hd);font-weight:600;font-size:26px;letter-spacing:-.6px;margin-bottom:6px}
.sub{color:var(--muted);font-size:14px;margin-bottom:24px}
.ph .sub{margin-bottom:0}
.sec{margin-top:36px}
.sec h3{font-family:var(--hd);font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--txt)}
.sec h3 svg{color:var(--gold)}

/* KPIs */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:18px 18px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
.kpi .l{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:7px;font-weight:500}
.kpi .l svg{width:15px;height:15px}
.kpi .v{font-family:var(--hd);font-weight:600;font-size:clamp(19px,4.6vw,25px);margin-top:10px;letter-spacing:-.5px}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:4px}
.kpi.caixa::before,.kpi.receber::before,.kpi.atraso::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.kpi.caixa::before{background:var(--ok)}.kpi.caixa .v{color:var(--ok)}
.kpi.receber::before{background:var(--gold)}.kpi.receber .v{color:var(--gold-hi)}
.kpi.atraso::before{background:var(--bad)}.kpi.atraso .v{color:var(--bad)}
.barra{display:flex;height:8px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.06);margin-top:12px;gap:2px}
.barra i{display:block;height:100%;border-radius:2px}
.leg{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.leg span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--c)}
.box{padding:18px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}

/* listas */
.linha{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.linha+.linha{margin-top:6px}
.linha .gr{flex:1;min-width:0}
.linha .n{font-weight:500}
.linha .m{font-size:13px;color:var(--muted);margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-pago{background:var(--okbg);color:var(--ok)}
.b-atrasado{background:var(--badbg);color:var(--bad)}
.b-aberto{background:var(--waitbg);color:var(--wait)}
.ent{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font-size:13.5px}
.ent>svg{flex:none;width:18px;height:18px;margin-top:1px;color:var(--gold-hi)}
.ent .gr{flex:1;min-width:0}.ent .m{font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.est{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.est button{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);font-size:12px;color:var(--muted)}
.est button.on{border-color:var(--gold);color:var(--gold-hi);background:rgba(217,178,76,.1)}
.b-env{background:rgba(110,160,255,.14);color:#8fb4ff}
.tconta{color:var(--gold-hi)}
.vazio{color:var(--muted);text-align:center;padding:36px 12px;border:1px dashed var(--line2);border-radius:14px;font-size:14px}

/* filtros */
.barf{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.barf .in{flex:1;min-width:200px}
.seg{display:inline-flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:3px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--line);max-width:100%}
.seg::-webkit-scrollbar{display:none}
.seg button{height:32px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button.on{background:rgba(255,255,255,.09);color:var(--txt)}

/* cliente */
.cli{border-radius:14px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.cli+.cli{margin-top:10px}
.cli.atrasado{border-color:rgba(239,107,91,.35)}
.chead{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer}
.chead:hover{background:rgba(255,255,255,.015)}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(217,178,76,.12);color:var(--gold-hi);font-family:var(--hd);font-weight:600;font-size:14px;border:1px solid rgba(217,178,76,.3)}
.chead .gr{flex:1;min-width:0}
.chead .n{font-weight:600;font-size:15.5px}
.chead .m{font-size:13px;color:var(--muted);margin-top:2px}
.ctot{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.ctot div{padding:11px 18px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
.ctot div+div{border-left:1px solid var(--line)}
.ctot b{display:block;font-size:15px;color:var(--txt);font-family:var(--hd);font-weight:600;letter-spacing:0;text-transform:none;margin-top:3px}
@media(max-width:560px){.ctot div{padding:10px 12px}}
.cbody{border-top:1px solid var(--line);padding:4px 18px 16px;background:rgba(0,0,0,.12)}
.venda{padding:16px 0;border-bottom:1px solid var(--line)}
.venda:last-of-type{border-bottom:0}
.vtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.vtop .m{font-size:13px;color:var(--muted)}
.itens{font-size:14px;margin:8px 0 12px;line-height:1.55}
.parcs{display:flex;flex-wrap:wrap;gap:8px}
.pc{display:flex;flex-direction:column;align-items:flex-start;min-width:96px;padding:9px 11px;border-radius:10px;border:1px solid;font-size:11.5px;line-height:1.35;text-align:left;transition:.15s}
.pc:hover{transform:translateY(-1px)}
.pc .ck{width:18px;height:18px;border-radius:5px;border:1.5px solid currentColor;display:grid;place-items:center;margin-bottom:6px}
.pc .ck svg{width:12px;height:12px;stroke-width:3}
.pc b{font-size:12px;font-weight:600}
.pc.pago{color:var(--ok);background:var(--okbg);border-color:rgba(76,195,138,.35)}
.pc.pago .ck{background:var(--ok);color:#06331a;border-color:var(--ok)}
.pc.atrasado{color:var(--bad);background:var(--badbg);border-color:rgba(239,107,91,.35)}
.pc.aberto{color:var(--wait);border-color:var(--line2)}
.vacoes{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

/* nova venda */
.form{display:grid;gap:16px}
.form>*,.grid2>*,.grid3>*,.f{min-width:0}.in{min-width:0}
@media(max-width:380px){.grid2{grid-template-columns:1fr}.linha{flex-wrap:wrap}.linha .gr{flex-basis:100%}}
.card{padding:22px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.card>h3{font-family:var(--hd);font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
@media(max-width:560px){.card{padding:18px 16px}}
.item{display:grid;grid-template-columns:1fr 76px 120px 36px;gap:10px;align-items:end}
.item+.item{margin-top:12px}
@media(max-width:560px){.item{grid-template-columns:1fr 1fr 36px}.item .iprod{grid-column:1/-1}}
.xbtn{width:36px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--faint)}
.xbtn:hover{color:var(--bad)}
.tot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.tot b{font-family:var(--hd);font-size:24px;font-weight:600;color:var(--gold-hi)}
.ptab{margin-top:14px;font-size:14px;display:grid;gap:8px}
.prow{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;align-items:center}
.prow .in{padding:0 9px}
.ptab .in{height:40px;font-size:15px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;color:var(--txt)}
.chk input{width:18px;height:18px;accent-color:var(--ok)}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.45}

/* estoque */
.prod{display:flex;align-items:center;gap:14px;padding:10px 14px 10px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.prod+.prod{margin-top:6px}
.prod.inativo{opacity:.5}
.prod img{width:52px;height:52px;object-fit:contain;border-radius:9px;background:rgba(255,255,255,.04);flex:none;padding:3px}
.prod .gr{flex:1;min-width:0}
.prod .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod .m{font-size:12.5px;color:var(--muted);margin-top:1px}
.qtd{display:flex;align-items:center;gap:2px;border:1px solid var(--line2);border-radius:9px;padding:2px}
.qtd button{width:28px;height:28px;border-radius:7px;font-weight:500;color:var(--muted)}
.qtd button:hover{background:rgba(255,255,255,.06);color:var(--txt)}
.qtd span{min-width:26px;text-align:center;font-weight:600;font-size:14px}
.qtd span.zero{color:var(--bad)}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(3,8,15,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
@media(min-width:640px){.modal{align-items:center;padding:20px}}
.mbox{width:100%;max-width:580px;max-height:92vh;overflow:auto;background:var(--panel-s);border:1px solid var(--line2);border-radius:20px 20px 0 0;padding:24px}
@media(min-width:640px){.mbox{border-radius:18px;padding:28px}}
.mbox h3{font-family:var(--hd);font-size:18px;font-weight:600;margin-bottom:18px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);background:#13263f;border:1px solid var(--line2);padding:12px 18px;border-radius:10px;z-index:80;font-weight:500;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.toast{bottom:96px}}
.ctot.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:560px){.ctot.c4{grid-template-columns:repeat(2,1fr)}.ctot.c4 div:nth-child(3){border-left:0}.ctot.c4 div:nth-child(n+3){border-top:1px solid var(--line)}}
.isec{padding:18px 0;border-bottom:1px solid var(--line)}
.ihead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ihead h4{font-family:var(--hd);font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.extrato{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
@media(max-width:640px){.extrato{grid-template-columns:1fr}}
.extrato div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px;color:var(--muted)}
.extrato div b{color:var(--txt);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.extrato div.dest span{color:var(--txt);font-weight:500}
.extrato div.dest b{font-family:var(--hd);font-weight:600}
.tab{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tr{display:flex;align-items:center;gap:12px;padding:10px 12px;font-size:13.5px}
.tr+.tr{border-top:1px solid var(--line)}
.tr>span:first-child:not(.gr){color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tr .gr{flex:1;min-width:0;display:flex;flex-direction:column}
.tr .nn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .mm{font-size:12px;color:var(--muted)}
.tr img{width:38px;height:38px;object-fit:contain;border-radius:8px;background:rgba(255,255,255,.04);flex:none}
.tr .rr{display:flex;flex-direction:column;align-items:flex-end;text-align:right;flex:none}
.tr .rr b{color:var(--gold-hi);font-family:var(--hd);font-weight:600}
.pill{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--waitbg);color:var(--wait);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}
.xs{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--faint);flex:none}
.xs:hover{color:var(--bad);background:var(--badbg)}
.xs svg{width:14px;height:14px}
@media(max-width:900px){nav.tabs button{font-size:9.5px}}
.fotoprev{display:flex;align-items:center;gap:14px}
.fotoprev img{width:76px;height:76px;object-fit:contain;border-radius:12px;background:rgba(255,255,255,.04);padding:4px}
.esplit{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:760px){.esplit{grid-template-columns:1fr}}
.ebox{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--surface,rgba(255,255,255,.02))}
.eh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-bottom:12px}
.eh .dot{width:8px;height:8px;border-radius:50%}
.erow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.erow small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}
.erow b{font-size:17px}
.ebox .s{margin-top:10px;font-size:12.5px;color:var(--muted)}
.eprow{display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.eprow.eph{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.epl{display:none}
@media(max-width:560px){.eprow{grid-template-columns:28px 1fr 1fr}.eprow [name=pago_em]{grid-column:2/-1}.eprow.eph span:last-child{display:none}.epl{display:block;font-size:10.5px;color:var(--muted);line-height:1.1}.eprow{margin-bottom:14px}}
.cadres{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.cadres div{display:flex;flex-direction:column;gap:3px}
.cadres span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.cadres b{font-size:16px}
@media(max-width:640px){.cadres{grid-template-columns:1fr 1fr}}

<script>
const api = criarApi();
const D = { produtos: [], clientes: [], vendas: [], cats: [], cfg: {}, investidores: [] };
const UI = { tab: 'resumo', fVend: 'todos', qVend: '', abertos: new Set(), qEst: '', fEst: 'todos', invAbertos: new Set(), cadModo: 'novo' };
const $ = (s) => document.querySelector(s);
const FORMAS = ['Pix', 'Dinheiro', 'Cartão de débito', 'Cartão de crédito', 'Crediário (parcelado direto)', 'Transferência'];
const CANAIS = ['WhatsApp', 'Instagram', 'Presencial', 'Outro'];

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2600); }
function abrirModal(html) { $('#mbox').innerHTML = html; $('#modal').classList.add('on'); }
function fecharModal() { $('#modal').classList.remove('on'); }
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal' || e.target.closest('[data-fechar]')) fecharModal(); });
async function tentar(fn, okMsg) { try { const r = await fn(); if (okMsg) toast(okMsg); return r; } catch (e) { console.error(e); toast('Erro: ' + e.message); throw e; } }
const r2 = (v) => Math.round((Number(v) || 0) * 100) / 100;
const addMeses = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); const dt = new Date(Date.UTC(y, m - 1 + n, 1)); const ult = new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 0)).getUTCDate(); dt.setUTCDate(Math.min(d, ult)); return dt.toISOString().slice(0, 10); };
const iniciais = (n) => (n || '?').trim().split(/\s+/).slice(0, 2).map(s => s[0]).join('').toUpperCase();
const imgProd = (p) => p.imagem || 'img/logo_gold.png';
const nomeProd = (p) => [p.marca, p.nome].filter(Boolean).join(' ');
const precoProd = (p) => (p.preco_promo && +p.preco_promo > 0 && +p.preco_promo < +p.preco) ? +p.preco_promo : (+p.preco || 0);

// ---------- status ----------
const stParc = (p) => p.pago_em ? 'pago' : (p.vencimento < hojeISO() ? 'atrasado' : 'aberto');
function stVenda(v) { const s = v.parcelas.map(stParc); if (s.every(x => x === 'pago')) return 'pago'; if (s.includes('atrasado')) return 'atrasado'; return 'aberto'; }
const ROT = { pago: 'Pago', atrasado: 'Atrasado', aberto: 'Em aberto' };
const badge = (s) => `<span class="badge b-${s}">${ROT[s]}</span>`;

function numeros() {
  const hoje = hojeISO(), mes = hoje.slice(0, 7);
  let caixa = 0, receber = 0, atrasado = 0, vendido = 0, caixaMes = 0, vendidoMes = 0, nAtraso = 0, taxas = 0;
  for (const v of D.vendas) {
    vendido += +v.total; taxas += +v.taxa || 0; if (v.data.slice(0, 7) === mes) vendidoMes += +v.total;
    for (const p of v.parcelas) {
      if (p.pago_em) { caixa += +p.valor; if (p.pago_em.slice(0, 7) === mes) caixaMes += +p.valor; }
      else { receber += +p.valor; if (p.vencimento < hoje) { atrasado += +p.valor; nAtraso++; } }
    }
  }
  let unid = 0, valorEst = 0, custoEst = 0, esgot = 0, semPreco = 0;
  for (const p of D.produtos) {
    if (p.estoque > 0) { unid += p.estoque; valorEst += p.estoque * precoProd(p); custoEst += p.estoque * (+p.custo || 0); if (!precoProd(p)) semPreco++; }
    else esgot++;
  }
  const itensVend = D.vendas.reduce((s, v) => s + v.venda_itens.filter(i => i.produto_id || !/^(Juros do parcelamento|Desconto)/.test(i.descricao || '')).reduce((a, i) => a + i.quantidade, 0), 0);
  // resultado: lucro = vendas − custo dos itens; parte dos investidores sai do lucro
  let custoVend = 0, semCusto = 0, parteInv = 0, lucroMes = 0;
  const pctInv = new Map((D.investidores || []).map(i => [i.id, +i.percentual || 0]));
  for (const v of D.vendas) {
    let lv = 0;
    for (const i of v.venda_itens) {
      const c = +i.custo_unit || 0, l = i.quantidade * (+i.preco_unit - c);
      if (i.produto_id && !c) semCusto += i.quantidade;
      custoVend += i.quantidade * c; lv += l;
      if (i.investidor_id) { const pi = l * (+(i.percentual ?? pctInv.get(i.investidor_id) ?? 0)) / 100; parteInv += pi; lv -= pi; }
    }
    lv -= +v.taxa || 0;
    if (v.data.slice(0, 7) === mes) lucroMes += lv;
  }
  const lucroBruto = vendido - custoVend - taxas, lucroMLZ = lucroBruto - parteInv;
  // investimento da MLZ = custo do estoque próprio + custo dos produtos próprios já vendidos
  let custoVendMLZ = 0;
  for (const v of D.vendas) for (const i of v.venda_itens) if (i.produto_id && !i.investidor_id) custoVendMLZ += i.quantidade * (+i.custo_unit || 0);
  const custoEstMLZ = estoqueSplit().mlz.custo, investMLZ = custoVendMLZ + custoEstMLZ;
  const pagoInv = (D.investidores || []).reduce((s, i) => s + i.repasses.reduce((a, r) => a + +r.valor, 0), 0);
  return { caixa, receber, atrasado, vendido, caixaMes, vendidoMes, nAtraso, unid, valorEst, custoEst, esgot, semPreco, itensVend, custoVend, semCusto, parteInv, lucroBruto, lucroMLZ, lucroMes, pagoInv, taxas, custoVendMLZ, custoEstMLZ, investMLZ };
}
// estoque separado: unidades livres dos lotes de investidores x resto da MLZ
function estoqueSplit() {
  const vendLote = new Map();
  for (const v of D.vendas) for (const i of v.venda_itens) if (i.lote_id) vendLote.set(i.lote_id, (vendLote.get(i.lote_id) || 0) + i.quantidade);
  const livreProd = new Map(), porInv = new Map();
  for (const inv of (D.investidores || [])) for (const l of inv.lotes) {
    const livre = Math.max(0, l.quantidade - (vendLote.get(l.id) || 0)); if (!livre) continue;
    const arr = livreProd.get(l.produto_id) || []; arr.push({ inv, livre, custo: +l.custo_unit || 0 }); livreProd.set(l.produto_id, arr);
  }
  const mlz = { unid: 0, venda: 0, custo: 0, prods: 0 }, inv = { unid: 0, venda: 0, custo: 0, prods: 0 };
  for (const p of D.produtos) {
    if (p.estoque <= 0) continue;
    let resta = p.estoque, usouInv = 0;
    for (const x of (livreProd.get(p.id) || [])) {
      const u = Math.min(resta, x.livre); if (!u) break;
      resta -= u; usouInv += u; inv.unid += u; inv.venda += u * precoProd(p); inv.custo += u * x.custo;
      const o = porInv.get(x.inv.id) || { nome: x.inv.nome, unid: 0 }; o.unid += u; porInv.set(x.inv.id, o);
    }
    if (usouInv) inv.prods++;
    if (resta > 0) { mlz.prods++; mlz.unid += resta; mlz.venda += resta * precoProd(p); mlz.custo += resta * (+p.custo || 0); }
  }
  return { mlz, inv, porInv: [...porInv.values()] };
}
const cliNome = (id) => (D.clientes.find(c => c.id === id) || {}).nome || 'Cliente';
const cliObj = (id) => D.clientes.find(c => c.id === id) || {};

// ---------- RESUMO ----------
function vResumo() {
  const n = numeros(), es = estoqueSplit();
  const tot = n.caixa + n.receber;
  const pct = (x) => tot ? (x / tot * 100) : 0;
  const hoje = hojeISO(), em7 = new Date(Date.now() + 7 * 864e5 - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  const pend = [];
  for (const v of D.vendas) for (const p of v.parcelas) if (!p.pago_em && p.vencimento <= em7) pend.push({ v, p });
  pend.sort((a, b) => a.p.vencimento.localeCompare(b.p.vencimento));
  $('#v-resumo').innerHTML = `
    <div class="ph"><div><h2 class="t">Resumo</h2><div class="sub">Visão geral do negócio · ${dataBR(hoje)}</div></div><button class="btn gold" data-irr="nova"><svg class="i"><use href="#i-plus"/></svg>Nova venda</button></div>
    <div class="kpis">
      <div class="kpi caixa"><div class="l"><svg class="i"><use href="#i-wallet"/></svg>Em caixa (recebido)</div><div class="v num">${brl(n.caixa)}</div><div class="s">Este mês: ${brl(n.caixaMes)}</div></div>
      <div class="kpi receber"><div class="l"><svg class="i"><use href="#i-clock"/></svg>A receber</div><div class="v num">${brl(n.receber)}</div><div class="s">Parcelas ainda não pagas</div></div>
      <div class="kpi atraso"><div class="l"><svg class="i"><use href="#i-alert"/></svg>Atrasado</div><div class="v num">${brl(n.atrasado)}</div><div class="s">${n.nAtraso} parcela${n.nAtraso === 1 ? '' : 's'} vencida${n.nAtraso === 1 ? '' : 's'}</div></div>
      <div class="kpi"><div class="l"><svg class="i"><use href="#i-tag"/></svg>Total vendido</div><div class="v num">${brl(n.vendido)}</div><div class="s">${n.itensVend} ite${n.itensVend === 1 ? 'm' : 'ns'} · mês: ${brl(n.vendidoMes)}</div></div>
    </div>
    <div class="box" style="margin-top:10px">
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)"><span>Recebido x a receber</span><span class="num">${tot ? Math.round(pct(n.caixa)) : 0}% recebido</span></div>
      <div class="barra"><i style="width:${pct(n.caixa)}%;background:var(--ok)"></i><i style="width:${pct(n.receber - n.atrasado)}%;background:var(--gold)"></i><i style="width:${pct(n.atrasado)}%;background:var(--bad)"></i></div>
      <div class="leg"><span style="--c:var(--ok)">Recebido</span><span style="--c:var(--gold)">A receber em dia</span><span style="--c:var(--bad)">Atrasado</span></div>
    </div>
    <div class="sec"><h3><svg class="i"><use href="#i-trend"/></svg>Resultado das vendas</h3>
      <div class="kpis">
        <div class="kpi"><div class="l">Lucro bruto</div><div class="v num">${brl(n.lucroBruto)}</div><div class="s">Vendas − custo (${brl(n.custoVend)}) − taxas (${brl(n.taxas)})</div></div>
        <div class="kpi"><div class="l">Parte dos investidores</div><div class="v num">${brl(n.parteInv)}</div><div class="s">Já pago a eles: ${brl(n.pagoInv)}</div></div>
        <div class="kpi caixa"><div class="l">Lucro da MLZ</div><div class="v num">${brl(n.lucroMLZ)}</div><div class="s">Este mês: ${brl(n.lucroMes)}</div></div>
        <div class="kpi"><div class="l">Margem</div><div class="v num">${n.vendido ? Math.round(n.lucroBruto / n.vendido * 100) : 0}%</div><div class="s">Lucro bruto ÷ vendas</div></div>
      </div>
      <div class="kpis" style="margin-top:10px">
        <div class="kpi"><div class="l"><svg class="i"><use href="#i-wallet"/></svg>Investido pela MLZ</div><div class="v num">${brl(n.investMLZ)}</div><div class="s">Custo pago nos produtos da loja</div></div>
        <div class="kpi"><div class="l">Capital que já voltou</div><div class="v num">${brl(n.custoVendMLZ)}</div><div class="s">Custo dos produtos vendidos</div></div>
        <div class="kpi"><div class="l">Ainda em estoque</div><div class="v num">${brl(n.custoEstMLZ)}</div><div class="s">Pelo custo pago</div></div>
        <div class="kpi caixa"><div class="l">Retorno do investimento</div><div class="v num">${n.investMLZ ? (n.lucroMLZ / n.investMLZ * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) : 0}%</div><div class="s">Lucro da MLZ ÷ investido</div></div>
      </div>
      ${n.semCusto ? `<div class="hint" style="color:var(--warn);margin-top:8px">${n.semCusto} unidade${n.semCusto === 1 ? '' : 's'} vendida${n.semCusto === 1 ? '' : 's'} sem custo cadastrado: o lucro aparece maior do que é. Cadastre o custo dos produtos em Estoque ou em Cadastrar → Repor estoque.</div>` : ''}
    </div>
    <div class="sec"><h3><svg class="i"><use href="#i-box"/></svg>Estoque para vender</h3>
      <div class="kpis">
        <div class="kpi"><div class="l">Unidades em estoque</div><div class="v num">${n.unid}</div><div class="s">${D.produtos.filter(p => p.estoque > 0).length} produtos · ${n.esgot} esgotado${n.esgot === 1 ? '' : 's'}</div></div>
        <div class="kpi"><div class="l">Valor do estoque (venda)</div><div class="v num">${brl(n.valorEst)}</div><div class="s">${n.semPreco ? `${n.semPreco} sem preço cadastrado` : 'Pelo preço do site'}</div></div>
        <div class="kpi"><div class="l">Custo do estoque</div><div class="v num">${brl(es.mlz.custo + es.inv.custo)}</div><div class="s">MLZ + investidores</div></div>
        <div class="kpi"><div class="l">Potencial total</div><div class="v num">${brl(n.caixa + n.receber + n.valorEst)}</div><div class="s">Caixa + a receber + estoque</div></div>
      </div>
      <div class="esplit">
        <div class="ebox"><div class="eh"><span class="dot" style="background:var(--gold)"></span>Estoque da MLZ</div>

async function alternarParcela(id) {
  let alvo; for (const v of D.vendas) for (const p of v.parcelas) if (p.id === id) alvo = p;
  if (!alvo) return;
  if (alvo.pago_em && !confirm(`Desmarcar a parcela ${alvo.numero} como paga?`)) return;
  const novo = alvo.pago_em ? null : hojeISO();
  await tentar(() => api.marcarParcela(id, novo), novo ? 'Parcela marcada como paga' : 'Parcela desmarcada');
  alvo.pago_em = novo; renderTudo();
}

function vVendas() {
  const q = UI.qVend.toLowerCase();
  const porCli = new Map();
  for (const v of D.vendas) { if (!porCli.has(v.cliente_id)) porCli.set(v.cliente_id, []); porCli.get(v.cliente_id).push(v); }
  let grupos = [...porCli.entries()].map(([cid, vs]) => {
    const pago = vs.reduce((s, v) => s + v.parcelas.filter(p => p.pago_em).reduce((a, p) => a + +p.valor, 0), 0);
    const total = vs.reduce((s, v) => s + +v.total, 0);
    const sts = vs.map(stVenda);
    const st = sts.includes('atrasado') ? 'atrasado' : sts.every(s => s === 'pago') ? 'pago' : 'aberto';
    return { c: cliObj(cid), cid, vs, pago, total, st };
  });
  const cont = { todos: grupos.length, aberto: grupos.filter(g => g.st === 'aberto').length, atrasado: grupos.filter(g => g.st === 'atrasado').length, pago: grupos.filter(g => g.st === 'pago').length };
  grupos = grupos.filter(g => (UI.fVend === 'todos' || g.st === UI.fVend) &&
    (!q || (g.c.nome || '').toLowerCase().includes(q) || g.vs.some(v => v.venda_itens.some(i => i.descricao.toLowerCase().includes(q)))));
  const ord = { atrasado: 0, aberto: 1, pago: 2 };
  grupos.sort((a, b) => ord[a.st] - ord[b.st] || (a.c.nome || '').localeCompare(b.c.nome || ''));
  const segs = [['todos', 'Todos'], ['atrasado', 'Atrasados'], ['aberto', 'Em aberto'], ['pago', 'Pagos']];
  $('#v-vendas').innerHTML = `
    <div class="ph"><div><h2 class="t">Vendas por cliente</h2><div class="sub">Toque nas parcelas para marcar como pagas.</div></div><button class="btn gold" data-ir="nova"><svg class="i"><use href="#i-plus"/></svg>Nova venda</button></div>

    <div class="barf"><input class="in" id="qVend" placeholder="Buscar cliente ou produto" value="${esc(UI.qVend)}"></div>
    <div class="seg" style="margin-bottom:14px">${segs.map(([k, l]) => `<button class="${UI.fVend === k ? 'on' : ''}" data-fv="${k}">${l} (${cont[k]})</button>`).join('')}</div>
    ${grupos.length ? grupos.map(cardCliente).join('') : `<div class="vazio">${D.vendas.length ? 'Nenhum cliente nesse filtro.' : 'Nenhuma venda registrada ainda. Toque em “Nova venda” para lançar a primeira.'}</div>`}`;
}

const hora = (t) => t ? new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(',', ' às') : '';

      <div class="tl"><span>Pago <b>${hora(v.criado_em) || dataBR(v.data)}</b></span>

        <span class="${v.entregue_em ? '' : 'no'}">${r.entregue} ${v.entregue_em ? '<b>' + hora(v.entregue_em) + '</b>' : '—'}</span></div>

    && (!q || cliNome(v.cliente_id).toLowerCase().includes(q) || (v.endereco || '').toLowerCase().includes(q)));

function contarEntregas() { const n = D.vendas.filter(v => v.entrega && (v.entrega_status || 'pendente') === 'pendente').length; const el = $('#nbEnt'); if (el) el.textContent = n || ''; }
function editarEntrega(id) {
  const v = D.vendas.find(x => x.id === id); if (!v) return;
  abrirModal(`<h3>Entrega da venda de ${dataBR(v.data)}</h3><div class="sub" style="margin:-4px 0 12px">${esc(cliNome(v.cliente_id))} · ${brl(v.total)}</div><form id="fent" class="form">

    <div class="mfoot"><button type="button" class="btn line" data-fechar>Cancelar</button><button class="btn gold">Salvar</button></div></form>`);
  $('#fent').onsubmit = async (e) => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    const d = { entrega: f.entrega || null, endereco: f.endereco.trim() || null, entrega_obs: f.entrega_obs.trim() || null };
    if (!d.entrega) d.entrega_status = null; else if (!v.entrega_status) d.entrega_status = 'pendente';
    await tentar(() => api.salvarEntrega(id, d), 'Entrega atualizada'); fecharModal(); await carregar();
  };
}
async function mudarEtapa(id, st) {
  const v = D.vendas.find(x => x.id === id); if (!v) return;
  const antes = { s: v.entrega_status, a: v.enviado_em, b: v.entregue_em }, agora = new Date().toISOString();
  v.entrega_status = st;
  if (st === 'pendente') { v.enviado_em = null; v.entregue_em = null; }
  if (st === 'enviado') { v.enviado_em = v.enviado_em || agora; v.entregue_em = null; }
  if (st === 'entregue') { v.entregue_em = agora; v.enviado_em = v.enviado_em || agora; }
  renderTudo(); contarEntregas();
  try { await api.salvarEntrega(v.id, { entrega_status: st }); }
  catch (err) { v.entrega_status = antes.s; v.enviado_em = antes.a; v.entregue_em = antes.b; renderTudo(); contarEntregas(); toast('Não foi possível salvar: ' + err.message); }
}
$('#v-entregas').addEventListener('click', (e) => {

function editarParcelas(vid) {

    <div class="mfoot"><button type="button" class="btn line" data-fechar>Cancelar</button><button class="btn gold">Salvar parcelas</button></div></form>`);
  const fm = $('#fparc');
  const ler = () => [...fm.querySelectorAll('[data-pid]')].map(r => ({ id: +r.dataset.pid, valor: num(r.querySelector('[name=valor]').value), vencimento: r.querySelector('[name=vencimento]').value, pago_em: r.querySelector('[name=pago_em]').value || null }));
  const aviso = () => { const soma = r2(ler().reduce((s, p) => s + p.valor, 0)), d = r2(+v.total - soma); $('#epAviso').innerHTML = Math.abs(d) > 0.004 ? `<div class="hint" style="color:var(--warn)">As parcelas somam ${brl(soma)}, diferença de ${brl(d)} para o total da venda.</div>` : ''; };
  fm.addEventListener('input', aviso); aviso();
  fm.onsubmit = async (e) => {
    e.preventDefault(); const novos = ler();
    if (novos.some(p => p.valor <= 0 || !p.vencimento)) return toast('Preencha valor e vencimento de todas as parcelas');
    const mud = novos.filter(n => { const o = ps.find(p => p.id === n.id); return r2(+o.valor) !== n.valor || o.vencimento !== n.vencimento || (o.pago_em || null) !== n.pago_em; });
    if (!mud.length) return fecharModal();

let NV;
function novaVendaVazia() {
  return { cliId: '', novoCli: { nome: '', telefone: '', instagram: '' }, data: hojeISO(), canal: 'WhatsApp', forma: 'Pix', obs: '', ent: '', endTxt: '',
    itens: [{ prod: '', desc: '', qtd: 1, preco: '' }], descPix: false, nCartao: 1, acresc: '', taxa: '', modo: 'avista', recebido: true, nParc: 3, entrada: '', juros: '', jurosTipo: 'mes', primeiroVenc: addMeses(hojeISO(), 1), parcelas: [], parcelasEditadas: false };
}
const brutoNV = () => r2(NV.itens.reduce((s, i) => s + (+i.qtd || 0) * (+String(i.preco).replace(',', '.') || 0), 0));
// taxas e descontos (tabela em Ajustes, a mesma da InfinitePay)
const pctCfg = (k) => { const d = parseFloat(String(D.cfg[k] || '').replace(',', '.')); return d > 0 && d < 100 ? d : 0; };
const taxasCartao = () => String(D.cfg.taxas_cartao || '').split(/[;,\s]+/).filter(Boolean).map(x => parseFloat(x.replace(',', '.')) || 0);
const maxSemJuros = () => Math.max(1, +D.cfg.parcelas_max || 1);
const descPixNV = () => (NV.forma === 'Pix' && NV.descPix && pctCfg('pix_desconto')) ? r2(-brutoNV() * pctCfg('pix_desconto') / 100) : 0;
const acrescNV = () => (NV.forma === 'Cartão de crédito' && NV.nCartao > maxSemJuros()) ? r2(+String(NV.acresc).replace(/\./g, '').replace(',', '.') || 0) : 0;
const totalNV = () => r2(brutoNV() + descPixNV() + acrescNV());
function pctTaxaNV() {
  if (NV.forma === 'Cartão de crédito') return taxasCartao()[Math.max(1, +NV.nCartao || 1) - 1] || 0;
  if (NV.forma === 'Cartão de débito') return pctCfg('taxa_debito');
  if (NV.forma === 'Pix') return pctCfg('taxa_pix');
  return 0;
}
const taxaAutoNV = () => r2(totalComJuros() * pctTaxaNV() / 100);
const taxaNV = () => String(NV.taxa).trim() === '' ? taxaAutoNV() : r2(+String(NV.taxa).replace(/\./g, '').replace(',', '.') || 0);
function htmlTaxa() {
  const t = taxaNV(), liq = r2(totalComJuros() - t);
  return `<div class="tot" style="margin-top:10px"><span>Total ${brl(totalComJuros())}${t ? ` · taxa ${brl(t)}` : ''}</span><b class="num" style="color:var(--ok)">Você recebe ${brl(liq)}</b></div>`;
}
// juros do parcelamento: "% ao mês" = tabela Price (parcelas iguais); "% sobre o total" = acréscimo único
function jurosNV() {
  if (NV.modo === 'avista') return 0;
  const i = (+String(NV.juros).replace(',', '.') || 0) / 100; if (i <= 0) return 0;
  const fin = r2(totalNV() - (+String(NV.entrada).replace(',', '.') || 0)), n = Math.max(1, +NV.nParc || 1);
  if (fin <= 0) return 0;
  if (NV.jurosTipo === 'total') return r2(fin * i);
  const pmt = fin * i / (1 - Math.pow(1 + i, -n));
  return r2(r2(pmt) * n - fin);
}
const totalComJuros = () => r2(totalNV() + jurosNV());
function gerarParcelas() {
  const total = totalNV(); const ps = [];
  if (NV.modo === 'avista') { ps.push({ numero: 1, valor: total, vencimento: NV.data, pago: NV.recebido }); }
  else {
    const ent = r2(+String(NV.entrada).replace(',', '.') || 0);
    const n = Math.max(1, +NV.nParc || 1);
    let k = 1;
    if (ent > 0) ps.push({ numero: k++, valor: ent, vencimento: NV.data, pago: true });
    const resto = r2(total - ent + jurosNV()), base = Math.floor(resto / n * 100) / 100;
    for (let j = 0; j < n; j++) {
      const valor = j === 0 ? r2(resto - base * (n - 1)) : base;
      ps.push({ numero: k++, valor, vencimento: addMeses(NV.primeiroVenc, j), pago: false });
    }
  }
  NV.parcelas = ps;
}
function htmlParcelas() {

  if ((b = e.target.closest('[data-delit]'))) { NV.itens.splice(+b.dataset.delit, 1); NV.parcelasEditadas = false; return vNova(); }
  if (e.target.closest('[data-recalc]')) { NV.parcelasEditadas = false; return vNova(); }
  if (e.target.closest('[data-limpar]')) { NV = novaVendaVazia(); return vNova(); }
  if ((b = e.target.closest('[data-salvar]'))) return salvarVenda(b);
});
async function salvarVenda(btn) {
  if (!NV.cliId && !NV.novoCli.nome.trim()) return toast('Informe o cliente');
  const itens = [];
  for (const it of NV.itens) {
    const preco = r2(+String(it.preco).replace(/\./g, '').replace(',', '.') || 0), qtd = parseInt(it.qtd, 10) || 0;
    if (!it.prod) return toast('Escolha o produto em todas as linhas');
    if (qtd < 1) return toast('Quantidade inválida');
    if (preco <= 0) return toast('Informe o preço de cada produto');
    if (it.prod === 'outro') { if (!it.desc.trim()) return toast('Descreva o item “Outro”'); itens.push({ produto_id: '', descricao: it.desc.trim(), quantidade: qtd, preco_unit: preco }); }
    else { const p = D.produtos.find(x => String(x.id) === String(it.prod)); if (p.estoque < qtd && !confirm(`${nomeProd(p)} tem só ${p.estoque} em estoque. Registrar mesmo assim?`)) return; itens.push({ produto_id: p.id, descricao: nomeProd(p), quantidade: qtd, preco_unit: preco }); }
  }
  if (descPixNV()) itens.push({ produto_id: '', descricao: `Desconto Pix (${String(pctCfg('pix_desconto')).replace('.', ',')}%)`, quantidade: 1, preco_unit: descPixNV() });
  if (acrescNV()) itens.push({ produto_id: '', descricao: `Juros do parcelamento (${NV.nCartao}x no cartão, pago pelo cliente)`, quantidade: 1, preco_unit: acrescNV() });
  const juros = jurosNV();
  if (juros > 0) itens.push({ produto_id: '', descricao: `Juros do parcelamento (${String(NV.juros).replace('.', ',')}% ${NV.jurosTipo === 'total' ? 'sobre o total' : 'a.m.'})`, quantidade: 1, preco_unit: juros });
  const total = totalComJuros(), soma = r2(NV.parcelas.reduce((s, p) => s + p.valor, 0));
  if (Math.abs(total - soma) > 0.004 && !confirm(`As parcelas somam ${brl(soma)} e a venda é de ${brl(total)}. Salvar mesmo assim?`)) return;
  btn.disabled = true;
  try {
    let cid = NV.cliId;
    if (!cid) { const c = await api.salvarCliente({ nome: NV.novoCli.nome.trim(), telefone: NV.novoCli.telefone.trim() || null, instagram: NV.novoCli.instagram.trim().replace(/^@/, '') || null }); cid = c.id; }
    const forma = NV.forma, taxa = taxaNV(), obsCartao = NV.forma === 'Cartão de crédito' && +NV.nCartao > 1 ? `Cartão ${NV.nCartao}x` : '';
    const vid = await api.registrarVenda({ p_cliente_id: +cid, p_data: NV.data, p_forma: forma, p_canal: NV.canal, p_obs: [obsCartao, NV.obs].filter(Boolean).join(' · ') || null, p_itens: itens,
      p_parcelas: NV.parcelas.map(p => ({ numero: p.numero, valor: p.valor, vencimento: p.vencimento, pago_em: p.pago ? (p.vencimento <= hojeISO() ? p.vencimento : hojeISO()) : '' })) });
    if (taxa > 0 && vid) { try { await api.salvarEntrega(+vid, { taxa }); } catch (e) { console.error(e); toast('Venda salva, mas a taxa não: ' + e.message); } }
    if (NV.ent && vid) {
      const end = NV.ent === 'entrega' ? (NV.endTxt || (NV.cliId ? cliObj(NV.cliId).endereco || '' : '')).trim() || null : null;
      try { await api.salvarEntrega(+vid, { entrega: NV.ent, endereco: end, entrega_status: 'pendente' }); if (end) await api.salvarCliente({ id: +cid, endereco: end }); } catch (e) { console.error(e); toast('Venda salva, mas a entrega não: ' + e.message); }
    }
    toast('Venda registrada!');
    UI.abertos.add(+cid); NV = novaVendaVazia();
    await carregar(); irPara('vendas');
  } catch (e) { console.error(e); toast('Erro: ' + e.message); btn.disabled = false; }
}

// ---------- INVESTIDORES ----------
function contaInvestidor(inv) {
  const aportado = inv.aportes.reduce((s, a) => s + +a.valor, 0);
  const repassado = inv.repasses.reduce((s, a) => s + +a.valor, 0);
  const comprado = inv.lotes.reduce((s, l) => s + l.quantidade * +l.custo_unit, 0);
  const unid = inv.lotes.reduce((s, l) => s + l.quantidade, 0);
  const itens = [];
  for (const v of D.vendas) {
    const pago = v.parcelas.filter(p => p.pago_em).reduce((s, p) => s + +p.valor, 0);
    const frac = +v.total > 0 ? Math.min(1, pago / +v.total) : 0;
    for (const i of v.venda_itens) if (i.investidor_id === inv.id) {
      const receita = i.quantidade * +i.preco_unit, custo = i.quantidade * (+i.custo_unit || 0), lucro = receita - custo;
      const parte = lucro * (+(i.percentual ?? inv.percentual)) / 100;
      itens.push({ v, i, receita, custo, lucro, parte, frac, liberado: parte * frac });
    }
  }
  itens.sort((a, b) => b.v.data.localeCompare(a.v.data));
  const soma = (k) => itens.reduce((s, x) => s + x[k], 0);
  const vendidas = itens.reduce((s, x) => s + x.i.quantidade, 0);
  const vendLote = (lid) => itens.filter(x => x.i.lote_id === lid).reduce((s, x) => s + x.i.quantidade, 0);
  const restCusto = inv.lotes.reduce((s, l) => s + (l.quantidade - vendLote(l.id)) * +l.custo_unit, 0);
  const liberado = soma('liberado');
  return { aportado, repassado, comprado, unid, itens, vendidas, vendLote, restCusto, receita: soma('receita'), custoV: soma('custo'), lucro: soma('lucro'), parte: soma('parte'), liberado, aPagar: Math.max(0, liberado - repassado), adiantado: Math.max(0, repassado - liberado), caixa: aportado - comprado };
}
const prodNome = (id) => { const p = D.produtos.find(x => x.id === id); return p ? nomeProd(p) : 'Produto removido'; };
const prodImg = (id) => { const p = D.produtos.find(x => x.id === id); return p ? imgProd(p) : 'img/logo_gold.png'; };

function vInvest() {
  const contas = D.investidores.map(inv => ({ inv, c: contaInvestidor(inv) }));
  const T = (k) => contas.reduce((s, x) => s + x.c[k], 0);
  $('#v-invest').innerHTML = `

        ${inv.aportes.length ? `<div class="tab">${[...inv.aportes].sort((a, b) => b.data.localeCompare(a.data)).map(a => `<div class="tr"><span>${dataBR(a.data)}</span><span class="gr">${esc(a.obs || 'Aporte')}</span><b class="num">${brl(a.valor)}</b><button class="xs" data-delaporte="${a.id}" title="Excluir"><svg class="i"><use href="#i-x"/></svg></button></div>`).join('')}</div>` : '<div class="hint">Nenhum aporte registrado.</div>'}

        ${inv.lotes.length ? `<div class="tab">${[...inv.lotes].sort((a, b) => b.data.localeCompare(a.data)).map(l => { const vend = c.vendLote(l.id); return `<div class="tr lt">
          <img src="${esc(prodImg(l.produto_id))}" alt=""><span class="gr"><span class="nn">${esc(prodNome(l.produto_id))}</span><span class="mm">${dataBR(l.data)} · ${l.quantidade} un. × ${brl(l.custo_unit)} = ${brl(l.quantidade * l.custo_unit)}</span></span>

function extratoTexto(inv, c) {
  return `Olá, ${inv.nome.split(' ')[0]}! Extrato do seu investimento na MLZ Company (${dataBR(hojeISO())}):\n` +
    `• Investido: ${brl(c.aportado)}\n• Produtos comprados: ${c.unid} un. (${brl(c.comprado)})\n• Vendidos: ${c.vendidas} un.\n• Lucro gerado: ${brl(c.lucro)}\n` +
    `• Sua parte (${(+inv.percentual).toLocaleString('pt-BR')}%): ${brl(c.parte)}\n• Já pago a você: ${brl(c.repassado)}\n• A receber agora: ${brl(Math.max(0, c.aPagar))}`;
}

const elInv = $('#v-invest');
elInv.addEventListener('click', async (e) => {
  let b;
  if ((b = e.target.closest('[data-toginv]'))) { const id = +b.dataset.toginv; UI.invAbertos.has(id) ? UI.invAbertos.delete(id) : UI.invAbertos.add(id); return vInvest(); }
  if (e.target.closest('[data-novoinv]')) return formInvestidor(null);
  if ((b = e.target.closest('[data-editinv]'))) return formInvestidor(+b.dataset.editinv);
  if ((b = e.target.closest('[data-aporte]'))) return formValor('aporte', +b.dataset.aporte);
  if ((b = e.target.closest('[data-repasse]'))) return formValor('repasse', +b.dataset.repasse);
  if ((b = e.target.closest('[data-lote]'))) return formLote(+b.dataset.lote);
  const del = async (attr, fn, msg, ok) => { if ((b = e.target.closest(`[${attr}]`))) { if (!confirm(msg)) return true; await tentar(() => fn(+b.getAttribute(attr)), ok); await carregar(); return true; } };
  if (await del('data-delaporte', api.excluirAporte, 'Excluir este aporte?', 'Aporte excluído')) return;
  if (await del('data-delrepasse', api.excluirRepasse, 'Excluir este pagamento?', 'Pagamento excluído')) return;
  if (await del('data-dellote', api.excluirLote, 'Excluir esta compra? As unidades saem do estoque (se foram somadas).', 'Compra excluída')) return;
  if (await del('data-delinv', api.excluirInvestidor, 'Excluir este investidor e todos os aportes e pagamentos dele?', 'Investidor excluído')) return;
});

function formInvestidor(id) {
  const x = id ? D.investidores.find(i => i.id === id) : { nome: '', telefone: '', pix: '', percentual: 50, obs: '', ativo: true };
  abrirModal(`<h3>${id ? 'Editar investidor' : 'Novo investidor'}</h3><form id="finv" class="form">
    <label class="f">Nome<input class="in" name="nome" required value="${esc(x.nome)}"></label>
    <div class="grid2"><label class="f">WhatsApp<input class="in" name="telefone" inputmode="tel" value="${esc(x.telefone || '')}"></label>
    <label class="f">Chave Pix (para pagar)<input class="in" name="pix" value="${esc(x.pix || '')}"></label></div>
    <div class="grid2"><label class="f">% do lucro para ele<input class="in num" name="percentual" inputmode="decimal" value="${String(x.percentual).replace('.', ',')}"></label>
    <label class="chk" style="align-self:end;height:44px"><input type="checkbox" name="ativo" ${x.ativo ? 'checked' : ''}>Ativo</label></div>
    ${id ? '' : `<div class="grid2"><label class="f">Valor investido agora (opcional)<input class="in num" name="aporte" inputmode="decimal" placeholder="0,00"></label><label class="f">Data<input class="in" type="date" name="data" value="${hojeISO()}"></label></div>`}
    <label class="f">Observações<textarea class="in" name="obs">${esc(x.obs || '')}</textarea></label>
    <div class="mfoot"><button type="button" class="btn line" data-fechar>Cancelar</button><button class="btn gold">Salvar</button></div></form>`);
  $('#finv').onsubmit = async (e) => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    const d = { nome: f.nome.trim(), telefone: f.telefone.trim() || null, pix: f.pix.trim() || null, percentual: +String(f.percentual).replace(',', '.') || 0, ativo: f.ativo === 'on', obs: f.obs.trim() || null };
    try {
      const salvo = await api.salvarInvestidor(id ? { id, ...d } : d);
      const ap = num(f.aporte); if (!id && ap > 0) await api.salvarAporte({ investidor_id: salvo.id, valor: ap, data: f.data, obs: 'Aporte inicial' });
      toast('Investidor salvo'); UI.invAbertos.add(salvo.id || id); fecharModal(); await carregar();
    } catch (err) { toast('Erro: ' + err.message); }
  };
}
const num = (s) => r2(+String(s || '').replace(/\./g, '').replace(',', '.') || 0);

function formValor(tipo, invId) {
  const inv = D.investidores.find(i => i.id === invId); const c = contaInvestidor(inv);
  const rep = tipo === 'repasse';
  abrirModal(`<h3>${rep ? 'Pagamento para ' : 'Aporte de '}${esc(inv.nome)}</h3><form id="fval" class="form">
    ${rep ? `<div class="hint" style="margin:0">Disponível para pagar agora: <b style="color:var(--gold-hi)">${brl(Math.max(0, c.aPagar))}</b>${inv.pix ? ` · Pix: ${esc(inv.pix)}` : ''}</div>` : ''}
    <div class="grid2"><label class="f">Valor<input class="in num" name="valor" inputmode="decimal" required value="${rep && c.aPagar > 0 ? c.aPagar.toFixed(2).replace('.', ',') : ''}" placeholder="0,00"></label>
    <label class="f">Data<input class="in" type="date" name="data" value="${hojeISO()}"></label></div>
    <label class="f">Observação<input class="in" name="obs" placeholder="${rep ? 'Ex.: Pix referente a novembro' : 'Ex.: compra do lote de dezembro'}"></label>
    <div class="mfoot"><button type="button" class="btn line" data-fechar>Cancelar</button><button class="btn gold">Salvar</button></div></form>`);
  $('#fval').onsubmit = async (e) => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const valor = num(f.valor);
    if (valor <= 0) return toast('Informe o valor');
    const d = { investidor_id: invId, valor, data: f.data, obs: f.obs.trim() || null };
    await tentar(() => rep ? api.salvarRepasse(d) : api.salvarAporte(d), rep ? 'Pagamento registrado' : 'Aporte registrado'); fecharModal(); await carregar();
  };
}

function formLote(invId) {
  const inv = D.investidores.find(i => i.id === invId); const c = contaInvestidor(inv);
  abrirModal(`<h3>Compra no nome de ${esc(inv.nome)}</h3><form id="flote" class="form">
    <div class="hint" style="margin:0">Dinheiro dele ainda não usado: <b style="color:var(--gold-hi)">${brl(c.caixa)}</b></div>
    <label class="f">Produto<select class="in" name="produto_id" required><option value="">Escolha…</option>${D.produtos.map(p => `<option value="${p.id}" data-custo="${p.custo ?? ''}">${esc(nomeProd(p))} · ${p.estoque} em estoque</option>`).join('')}</select></label>
    <div class="hint" style="margin-top:-6px">Produto novo? Cadastre primeiro em Estoque → Novo produto (com estoque 0).</div>
    <div class="grid3"><label class="f">Quantidade<input class="in num" type="number" min="1" name="quantidade" value="1" required></label>
    <label class="f">Custo por unidade<input class="in num" name="custo_unit" inputmode="decimal" required placeholder="0,00"></label>
    <label class="f">Data<input class="in" type="date" name="data" value="${hojeISO()}"></label></div>
    <label class="chk"><input type="checkbox" name="ja_no_estoque">Essas unidades já estão contadas no estoque (não somar de novo)</label>
    <label class="f">Observação<input class="in" name="obs" placeholder="Ex.: fornecedor, nota"></label>
    <div class="tot" style="margin-top:0"><span>Total da compra</span><b class="num" id="lTot">${brl(0)}</b></div>
    <div class="mfoot"><button type="button" class="btn line" data-fechar>Cancelar</button><button class="btn gold">Salvar compra</button></div></form>`);
  const fm = $('#flote');
  const atual = () => { $('#lTot').textContent = brl((parseInt(fm.quantidade.value, 10) || 0) * num(fm.custo_unit.value)); };
  fm.produto_id.onchange = () => { const o = fm.produto_id.selectedOptions[0]; if (o && o.dataset.custo && !fm.custo_unit.value) fm.custo_unit.value = (+o.dataset.custo).toFixed(2).replace('.', ','); atual(); };
  fm.addEventListener('input', atual);
  fm.onsubmit = async (e) => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(fm));
    const d = { investidor_id: invId, produto_id: +f.produto_id, quantidade: parseInt(f.quantidade, 10), custo_unit: num(f.custo_unit), data: f.data, ja_no_estoque: f.ja_no_estoque === 'on', obs: f.obs.trim() || null };
    if (!d.produto_id || d.quantidade < 1) return toast('Escolha o produto e a quantidade');
    try {
      await api.salvarLote(d);
      const p = D.produtos.find(x => x.id === d.produto_id); if (p && !+p.custo) await api.salvarProduto({ id: p.id, custo: d.custo_unit });
      toast('Compra registrada'); fecharModal(); await carregar();
    } catch (err) { toast('Erro: ' + err.message); }
  };
}

        <div class="hint">Outras cidades: cotação automática na SuperFrete e no Melhor Envio ao mesmo tempo, mostrando o menor preço de cada transportadora (com os tokens configurados no servidor).</div>
        <div class="grid2"><label class="f">Endereço de retirada<input class="in" name="retirada_endereco" value="${esc(c.retirada_endereco || '')}" placeholder="Rua, número, cidade"></label>
        <label class="f">Horário de retirada<input class="in" name="retirada_horario" value="${esc(c.retirada_horario || '')}" placeholder="Ex.: no mesmo dia, das 8:00 às 18:00"></label></div>
        <label class="f">Faixa de promoção no topo (deixe vazio para esconder)<input class="in" name="faixa_promo" value="${esc(c.faixa_promo || '')}" placeholder="Ex.: Esquenta Black Friday · 12% OFF"></label>
        <label class="f">Frase do topo do site<textarea class="in" name="mensagem_topo">${esc(c.mensagem_topo || '')}</textarea></label>
        <div><button class="btn gold">Salvar contatos</button></div>
      </form>
      <div class="card"><h3>Categorias</h3>
        ${D.cats.map(k => `<div class="linha"><div class="gr"><div class="n">${esc(k.nome)}</div><div class="m">${D.produtos.filter(p => p.categoria_id === k.id).length} produtos</div></div>
          <button class="btn sm line" data-rencat="${k.id}">Renomear</button><button class="btn sm red" data-delcat="${k.id}">Excluir</button></div>`).join('')}
        <form id="fcat" style="display:flex;gap:8px;margin-top:10px"><input class="in" name="nome" placeholder="Nova categoria (ex.: Eletrônicos)" required><button class="btn gold">Adicionar</button></form>
      </div>
      <form class="card form" id="fsenha"><h3>Trocar minha senha</h3>
        <label class="f">Nova senha (mín. 8 caracteres)<input class="in" type="password" name="s1" minlength="8" autocomplete="new-password" required></label>
        <label class="f">Repita a nova senha<input class="in" type="password" name="s2" minlength="8" autocomplete="new-password" required></label>
        <div><button class="btn gold">Trocar senha</button></div>
      </form>
      <div><button class="btn red" id="btSair"><svg class="i"><use href="#i-out"/></svg>Sair do painel</button></div>
    </div>`;
  $('#fcfg').onsubmit = async (e) => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); f.instagram = f.instagram.trim().replace(/^@/, ''); f.infinitepay_handle = (f.infinitepay_handle || '').trim().replace(/^\$/, '');
    await tentar(() => api.salvarConfig(f), 'Contatos salvos'); D.cfg = { ...D.cfg, ...f };
  };
  $('#fcat').onsubmit = async (e) => { e.preventDefault(); const nome = new FormData(e.target).get('nome').trim(); await tentar(() => api.salvarCategoria({ nome, ordem: D.cats.length + 1 }), 'Categoria criada'); await carregar(); };
  $('#fsenha').onsubmit = async (e) => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    if (f.s1 !== f.s2) return toast('As senhas não conferem');
    await tentar(() => api.trocarSenha(f.s1), 'Senha alterada'); e.target.reset();
  };
  $('#btSair').onclick = async () => { await api.sair(); location.reload(); };
}
$('#v-ajustes').addEventListener('click', async (e) => {
  let b;
  if ((b = e.target.closest('[data-rencat]'))) { const k = D.cats.find(c => c.id === +b.dataset.rencat); const nome = prompt('Novo nome da categoria', k.nome); if (nome && nome.trim()) { await tentar(() => api.salvarCategoria({ id: k.id, nome: nome.trim() }), 'Categoria renomeada'); await carregar(); } }
  if ((b = e.target.closest('[data-delcat]'))) { if (!confirm('Excluir a categoria? Os produtos dela ficam sem categoria.')) return; await tentar(() => api.excluirCategoria(+b.dataset.delcat), 'Categoria excluída'); await carregar(); }
});

// ---------- navegação ----------
const VIEWS = { resumo: vResumo, vendas: vVendas, entregas: vEntregas, nova: vNova, cad: vCad, estoque: vEstoque, invest: vInvest, ajustes: vAjustes };
function irPara(tab) {
  UI.tab = tab;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  Object.keys(VIEWS).forEach(k => $('#v-' + k).classList.toggle('hide', k !== tab));
  VIEWS[tab](); window.scrollTo(0, 0);
}
function renderTudo() { VIEWS[UI.tab](); }
$('#btSairLado').onclick = async () => { await api.sair(); location.reload(); };
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) irPara(b.dataset.tab); });

async function carregar() {
  const [produtos, clientes, vendas, cats, cfg, investidores, pedidos] = await Promise.all([api.produtos(), api.clientes(), api.vendas(), api.categorias(), api.config(), api.investidores(), api.pedidos().catch(() => [])]);
  Object.assign(D, { produtos, clientes, vendas, cats, cfg, investidores, pedidos });
  renderTudo(); contarEntregas();
}

async function iniciar() {
  try {
    const s = await api.sessao();
    if (!s) return mostrarLogin();
    if (!(await api.souAdmin())) { await api.sair(); return mostrarLogin('Este usuário não é administrador.'); }
    $('#login').classList.add('hide'); $('#app').classList.remove('hide');
    await carregar();
  } catch (e) { console.error(e); mostrarLogin('Erro ao conectar: ' + e.message); }
}
function mostrarLogin(msg) { $('#app').classList.add('hide'); $('#login').classList.remove('hide'); $('#lerro').textContent = msg || ''; }
$('#flogin').onsubmit = async (e) => {
  e.preventDefault(); $('#lerro').textContent = '';
  try { await api.entrar($('#lemail').value.trim(), $('#lsenha').value); await iniciar(); }
  catch (err) { $('#lerro').textContent = /invalid/i.test(err.message) ? 'E-mail ou senha incorretos.' : err.message; }
};
iniciar();
</script>
</body>
</html>
