<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07111f;--bg2:#0b1a2e;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--gold:#d9b24c;--gold-hi:#f1d68a;--txt:#f2f4f8;--muted:rgba(226,232,242,.66);--faint:rgba(226,232,242,.42);--ok:#4fd18b;--wait:#f1c35a;--bad:#ff8f7a;--hd:Montserrat,system-ui,sans-serif}
html,body{background:var(--bg)}
body{font-family:Outfit,system-ui,sans-serif;color:var(--txt);min-height:100vh;background:radial-gradient(60% 40% at 50% 0%,rgba(217,178,76,.10),transparent 70%),var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{max-width:880px;margin:0 auto;padding:22px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top img{height:20px}
.top a.vl{font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
main{max-width:720px;margin:0 auto;padding:10px 20px 60px}
h1{font-family:var(--hd);font-weight:600;font-size:26px;letter-spacing:-.5px}
.sub{color:var(--muted);margin-top:6px;line-height:1.55}
.box{border:1px solid var(--line);border-radius:22px;padding:24px 20px;background:rgba(255,255,255,.02);margin-top:20px}
.box h2{font-family:var(--hd);font-weight:600;font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.box h2 svg{color:var(--gold-hi)}
.auth{max-width:420px;margin:0 auto}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border:1px solid var(--line);border-radius:14px;margin:22px 0 4px}
.tabs button{height:42px;border-radius:10px;color:var(--muted);font-size:15px}
.tabs button.on{background:rgba(217,178,76,.14);color:var(--gold-hi)}
form{display:grid;gap:10px}
label{display:grid;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.in{width:100%;min-width:0;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);font:inherit;font-size:15.5px;outline:0}
.in:focus{border-color:var(--gold)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row.r3{grid-template-columns:1fr 76px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:50px;padding:0 22px;border-radius:999px;font-weight:500;font-size:15.5px}
.btn.solid{background:var(--gold);color:#0b1a2e}
.btn.solid:disabled{opacity:.6}
.btn.ghost{border:1px solid var(--line2)}
.btn.sm{height:40px;font-size:14px;padding:0 16px}
.link{color:var(--gold-hi);font-size:14px;text-align:center;padding:6px}
.msg{font-size:14px;text-align:center;line-height:1.5;padding:2px 4px}
.msg.er{color:var(--bad)}.msg.ok{color:var(--ok)}
.msg:empty{display:none}
.ola{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ola .em{color:var(--faint);font-size:13px;margin-top:4px;overflow-wrap:anywhere}
.ped{border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.ped+.ped{margin-top:10px}
.ped .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ped .t b{font-size:17px;font-weight:500}
.ped .m{color:var(--muted);font-size:13px;margin-top:3px}
.ped .it{font-size:14.5px;line-height:1.5;margin-top:8px}
.ped .ent{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;white-space:nowrap;flex:none}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:rgba(79,209,139,.12);color:var(--ok)}
.b-wait{background:rgba(241,195,90,.12);color:var(--wait)}
.b-env{background:rgba(110,160,255,.14);color:#8fb4ff}
.vazio{color:var(--muted);text-align:center;padding:26px 10px;border:1px dashed var(--line2);border-radius:14px;font-size:14px;line-height:1.6}
.load{display:grid;place-items:center;padding:70px 0}
.spin{width:28px;height:28px;border:3px solid rgba(217,178,76,.25);border-top-color:var(--gold);border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
main.wide{max-width:1040px}main.dash{max-width:880px}
.dhero{display:flex;align-items:center;gap:16px;padding:22px;border-radius:24px;border:1px solid rgba(217,178,76,.22);background:radial-gradient(80% 140% at 0% 0%,rgba(217,178,76,.16),transparent 60%),rgba(255,255,255,.02)}
.av{width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--hd);font-weight:600;font-size:21px;color:#0b1a2e;background:linear-gradient(145deg,var(--gold-hi),var(--gold));box-shadow:0 8px 24px -8px rgba(217,178,76,.6)}
.dh{flex:1;min-width:0}.dh .em{color:var(--faint);font-size:13.5px;margin-top:4px;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.st{border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:rgba(255,255,255,.02)}
.st span{display:block;color:var(--faint);font-size:11.5px;letter-spacing:1px;text-transform:uppercase}
.st b{display:block;font-family:var(--hd);font-weight:600;font-size:22px;margin-top:6px;color:var(--gold-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pend{display:flex;align-items:center;gap:12px;margin-top:12px;padding:14px 16px;border-radius:18px;border:1px solid rgba(241,195,90,.35);background:rgba(241,195,90,.07)}
.pend>svg.i{color:var(--wait);width:22px;height:22px}
.pend .gr{flex:1;min-width:0}.pend small{display:block;color:var(--muted);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtabs{display:flex;gap:6px;margin:20px 0 6px;padding:5px;border:1px solid var(--line);border-radius:16px;overflow-x:auto;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.dtabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;color:var(--muted);font-size:14.5px;white-space:nowrap}
.dtabs button.on{background:rgba(217,178,76,.14);color:var(--gold-hi)}
.dtabs em{font-style:normal;font-size:11px;min-width:19px;height:19px;border-radius:99px;background:var(--gold);color:#0b1a2e;display:grid;place-items:center;padding:0 5px}
.sh{font-family:var(--hd);font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);margin:20px 4px 10px}
#tabc .ped{border-radius:20px;padding:18px;background:rgba(255,255,255,.02)}
.ped .t b{font-size:16px}
.trk{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0 6px;position:relative}
.trk::before,.trk::after{content:"";position:absolute;top:13px;left:12.5%;height:2px;border-radius:2px}
.trk::before{right:12.5%;background:rgba(255,255,255,.08)}
.trk::after{width:calc(var(--k) * 25%);background:linear-gradient(90deg,var(--ok),var(--gold-hi))}
.trk li{display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;z-index:1;font-size:12px;color:var(--faint);text-align:center}
.trk i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);border:2px solid rgba(255,255,255,.12)}
.trk li.ok i{background:var(--ok);border-color:var(--ok);color:#06251a}
.trk li.ok span{color:var(--txt)}
.trk li.at i{box-shadow:0 0 0 5px rgba(79,209,139,.18)}
.trk svg.i{width:14px;height:14px;stroke-width:2.6}
.its{margin-top:12px;display:grid;gap:8px}
.itm{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;background:rgba(255,255,255,.025)}
.itm img,.itm .ph{width:52px;height:52px;border-radius:11px;object-fit:contain;background:rgba(255,255,255,.04);flex:none}
.itm .ph{display:grid;place-items:center;color:var(--faint)}
.itm .gr{flex:1;min-width:0;font-size:14.5px;line-height:1.3}.itm small{color:var(--muted);font-size:12.5px}
.itm>b{font-weight:500;font-size:14px;white-space:nowrap}
.pf{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.pf .tt{color:var(--muted);font-size:14px}.pf .tt b{color:var(--txt);font-size:18px;font-weight:500;margin-left:6px}
.pa{display:flex;gap:6px;flex-wrap:wrap}
.pa .mini{display:inline-flex;align-items:center;gap:6px}
.pa .mini svg.i{width:15px;height:15px}
.vazio.grande{display:grid;justify-items:center;gap:8px;padding:40px 20px;margin-top:14px}
.vazio.grande>svg.i{width:34px;height:34px;color:var(--gold)}
.vazio.grande b{color:var(--txt);font-size:16px;font-weight:500}
.vazio.grande .btn{margin-top:8px}
.ajuda{display:flex;align-items:center;gap:14px;margin-top:22px;padding:16px 18px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.ajuda>span{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(79,209,139,.12);color:var(--ok);flex:none}
.ajuda div{flex:1}.ajuda b{font-weight:500;display:block}.ajuda small{color:var(--muted);font-size:13.5px}
.ajuda>svg.i{color:var(--faint)}
#tabc .box{margin-top:14px}
#tabc .box .seg{margin-top:0}
@media(max-width:560px){.dhero{flex-wrap:wrap;padding:18px}.dhero .btn{margin-left:auto}.av{width:52px;height:52px;font-size:18px}.stats{gap:8px}.st{padding:12px}.st span{font-size:10px;letter-spacing:.5px}.st b{font-size:17px}
  .dtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.dtabs button{flex-direction:column;gap:3px;height:56px;padding:0 4px;font-size:11.5px;position:relative}.dtabs em{position:absolute;top:5px;right:calc(50% - 22px);min-width:16px;height:16px;font-size:10px}.trk li{font-size:11px}.pend{flex-wrap:wrap}.pend .btn{width:100%}}

.ag{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center;min-height:calc(100vh - 140px);padding:10px 0 20px}
.eyebrow{font-family:var(--hd);font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
.big{font-size:44px;line-height:1.08;letter-spacing:-1.5px;margin-top:14px}
.big span{background:linear-gradient(90deg,var(--gold-hi),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.bens{display:grid;gap:18px;margin-top:34px}
.ben{display:flex;gap:14px;align-items:flex-start}
.ben>span{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,rgba(217,178,76,.22),rgba(217,178,76,.05));border:1px solid rgba(217,178,76,.3);color:var(--gold-hi)}
.ben b{font-weight:500;font-size:15.5px;display:block}
.ben small{color:var(--muted);font-size:14px;line-height:1.45}
.acard{position:relative;border:1px solid rgba(217,178,76,.22);border-radius:26px;padding:28px 26px 24px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));box-shadow:0 30px 80px -30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06)}
.acard::before{content:"";position:absolute;inset:-1px;border-radius:26px;padding:1px;background:linear-gradient(160deg,rgba(241,214,138,.55),transparent 40%,transparent 70%,rgba(217,178,76,.3));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.acard .tabs{margin:0 0 22px}
.at{font-family:var(--hd);font-weight:600;font-size:22px;letter-spacing:-.4px}
.as{color:var(--muted);font-size:14.5px;margin:6px 0 18px;line-height:1.5}
.fi{position:relative;display:block}
.fi>svg.i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;width:17px;height:17px}
.fi .in{padding-left:42px}
.fi .in:focus+svg,.fi:focus-within>svg.i{color:var(--gold-hi)}
.olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--faint)}
.olho:hover{color:var(--txt)}
.fi input[name=senha]{padding-right:48px}
.forca{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:6px;align-items:center;margin-top:-2px}
.forca i{height:4px;border-radius:4px;background:rgba(255,255,255,.08)}
.forca span{font-size:12px;color:var(--faint);min-width:76px;text-align:right}
.forca[data-n="1"] i:nth-child(-n+1){background:var(--bad)}
.forca[data-n="2"] i:nth-child(-n+2){background:var(--wait)}
.forca[data-n="3"] i{background:var(--ok)}
.link.r{justify-self:end;padding:0 2px;font-size:13.5px;margin-top:-2px}
.acard .btn.solid{width:100%;margin-top:4px;box-shadow:0 10px 30px -10px rgba(217,178,76,.55)}
.termos{font-size:12.5px;color:var(--faint);text-align:center;line-height:1.5}
.termos a{color:var(--muted);text-decoration:underline}
.seg{margin-top:22px;padding:16px 16px 14px;border-radius:18px;background:rgba(79,209,139,.05);border:1px solid rgba(79,209,139,.18)}
.segh{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px;color:var(--ok)}
.segh svg.i{width:18px;height:18px}
.seg ul{list-style:none;display:grid;gap:8px;margin-top:10px}
.seg li{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--muted);line-height:1.4}
.seg li svg.i{width:15px;height:15px;color:rgba(79,209,139,.8);margin-top:1px}
@media(max-width:860px){.ag{grid-template-columns:1fr;gap:26px;min-height:0}.big{font-size:30px}.bens{grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.ben{flex-direction:column;gap:8px}.ben small{display:none}.ben b{font-size:13px}.ben>span{width:38px;height:38px;border-radius:12px}}
@media(max-width:420px){.acard{padding:22px 18px 18px;border-radius:22px}.acard::before{border-radius:22px}.big{font-size:27px}}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.end{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:16px;padding:13px 15px}
.end+.end{margin-top:8px}
.end.ed{border-color:var(--gold)}
.end .gr{flex:1;min-width:200px}
.end .n{font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.end .m{color:var(--muted);font-size:13.5px;margin-top:3px;line-height:1.45;overflow-wrap:anywhere}
.eacts{display:flex;gap:6px;flex-wrap:wrap}
.mini{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:13px;color:var(--muted)}
.mini:hover{color:var(--txt)}
.mini.red{color:var(--bad);border-color:rgba(255,143,122,.3)}
.fend{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.fend h3{font-family:var(--hd);font-weight:600;font-size:15px;margin-bottom:4px}
@media(max-width:420px){.row{grid-template-columns:1fr}.row.r3{grid-template-columns:1fr 70px}}
</style>
</head>

<script>
const api = criarApi({ conta: true });
const app = document.getElementById('app');
const q = new URLSearchParams(location.search);
const voltarSacola = q.get('voltar') === 'sacola';
let MODO = q.get('modo') === 'cadastro' ? 'cadastro' : 'entrar', RECUPERANDO = /type=recovery/.test(location.hash), CONTA = null;
const traduz = (m) => {
  m = String(m || '');
  if (/Invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/Email not confirmed/i.test(m)) return 'Confirme seu e-mail primeiro: enviamos um link para a sua caixa de entrada.';

  if (/at least 6|Password should/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (/rate limit|too many/i.test(m)) return 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.';
  if (/invalid.*email|Unable to validate email/i.test(m)) return 'Confira o e-mail digitado.';
  return m || 'Algo deu errado. Tente de novo.';
};

async function enviarAuth(e) {
  e.preventDefault(); const f = e.target, m = document.getElementById('am'), b = document.getElementById('ab');
  const email = f.email.value.trim(), senha = f.senha ? f.senha.value : '', nome = f.nome ? f.nome.value.trim() : '';
  m.className = 'msg er'; m.textContent = '';
  if (MODO === 'cadastro' && !nome) { m.textContent = 'Informe seu nome.'; return f.nome.focus(); }
  if (!/^\S+@\S+\.\S+$/.test(email)) { m.textContent = 'Confira o e-mail digitado.'; return f.email.focus(); }
  if (MODO !== 'esqueci' && senha.length < 6) { m.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return f.senha.focus(); }
  b.disabled = true;
  try {
    if (MODO === 'esqueci') {
      await api.recuperarSenha(email);
      MODO = 'entrar'; return telaAuth('Se esse e-mail tiver conta, o link para criar a senha nova já está na sua caixa de entrada (confira o spam também).', 'ok');
    }
    if (MODO === 'cadastro') {
      const r = await api.cadastrar(email, senha, nome);
      if (!r.session) { MODO = 'entrar'; return telaAuth('Conta criada! Enviamos um link de confirmação para o seu e-mail. Clique nele e depois entre aqui.', 'ok'); }
      try { await api.salvarConta(nome, '', null); } catch (_) {}
    } else await api.entrar(email, senha);
    await abrirConta(true);
  } catch (err) { m.textContent = traduz(err.message); b.disabled = false; }
}

    </form>` : (L.length < 10 ? '<button type="button" class="btn ghost sm" data-enovo style="margin-top:12px">+ Adicionar endereço</button>' : '')}`;
  const fe = document.getElementById('fe'); if (!fe) return;
  fe.cep.addEventListener('input', async () => {
    let c = soDigitos(fe.cep.value).slice(0, 8); fe.cep.value = c.length > 5 ? c.slice(0, 5) + '-' + c.slice(5) : c;
    if (c.length !== 8 || fe.cep.dataset.ok === c) return; fe.cep.dataset.ok = c;
    try { const d = await (await fetch(`https://viacep.com.br/ws/${c}/json/`)).json(); if (d.erro) { document.getElementById('fem').textContent = 'CEP não encontrado. Confira ou preencha à mão.'; return; }
      document.getElementById('fem').textContent = '';
      if (d.logradouro) fe.rua.value = d.logradouro; if (d.bairro) fe.bairro.value = d.bairro; if (d.localidade) fe.cidade.value = d.localidade; if (d.uf) fe.uf.value = d.uf;
      (d.logradouro ? fe.numero : fe.rua).focus(); } catch (_) {}
  });
  fe.onsubmit = async (ev) => {
    ev.preventDefault(); const m = document.getElementById('fem');
    const n = { id: e.id || '', apelido: fe.apelido.value.trim() }; CAMPOS.forEach(k => n[k] = fe[k].value.trim()); n.uf = n.uf.toUpperCase();
    const falta = [['cep', 'o CEP'], ['rua', 'a rua'], ['numero', 'o número'], ['bairro', 'o bairro'], ['cidade', 'a cidade'], ['uf', 'o estado (UF)']].find(([k]) => !n[k] || (k === 'cep' && soDigitos(n.cep).length !== 8));
    if (falta) { m.textContent = `Informe ${falta[1]}.`; return fe[falta[0]].focus(); }
    const L2 = [...L]; if (EDIT === -1) L2.push(n); else L2[EDIT] = n;
    await gravar(L2, 'Endereço salvo!');
  };
}
async function gravar(lista, ok) {
  try { CONTA.enderecos = await api.salvarEnderecos(lista); EDIT = null; renderEnderecos(ok); }
  catch (err) { const m = document.getElementById('fem') || document.getElementById('em'); m.className = 'msg er'; m.textContent = traduz(err.message); }
}
app.addEventListener('click', async (ev) => {
  const b = ev.target.closest('[data-eed],[data-epr],[data-edel],[data-enovo],[data-ecanc]'); if (!b || !CONTA) return;
  const L = CONTA.enderecos;
  if (b.dataset.enovo !== undefined) { EDIT = -1; renderEnderecos(); return document.querySelector('#fe [name=apelido]').focus(); }
  if (b.dataset.ecanc !== undefined) { EDIT = null; return renderEnderecos(); }
  if (b.dataset.eed) { EDIT = +b.dataset.eed; renderEnderecos(); return document.getElementById('fe').scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  if (b.dataset.epr) { const i = +b.dataset.epr; return gravar([L[i], ...L.filter((_, k) => k !== i)], 'Endereço principal atualizado!'); }
  if (b.dataset.edel) { const i = +b.dataset.edel; if (!confirm(`Excluir o endereço "${L[i].apelido || fmtEnd(L[i])}"?`)) return; return gravar(L.filter((_, k) => k !== i), 'Endereço excluído.'); }
});

(async () => {
  let s = null; try { s = await api.sessao(); } catch (_) {}
  api.aoMudarLogin && api.aoMudarLogin((ev) => { if (ev === 'PASSWORD_RECOVERY') { RECUPERANDO = true; telaNovaSenha(); } });
  if (s && RECUPERANDO) return telaNovaSenha();
  if (s) return abrirConta();
  const erroUrl = new URLSearchParams(location.hash.slice(1)).get('error_description');
  telaAuth(erroUrl ? 'O link expirou ou já foi usado. Peça um novo.' : '');
})();
