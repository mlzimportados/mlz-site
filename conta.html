<style>
*{margin:0;padding:0;box-sizing:border-box}

body{font-family:Outfit,system-ui,sans-serif;color:var(--txt);min-height:100vh;background:radial-gradient(60% 40% at 50% 0%,rgba(217,178,76,.10),transparent 70%),var(--bg);-webkit-font-smoothing:antialiased}

.mini{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:13px;color:var(--muted)}

@media(max-width:420px){.row{grid-template-columns:1fr}.row.r3{grid-template-columns:1fr 70px}}
</style>

<script>
const api = criarApi({ conta: true });
const app = document.getElementById('app');
const q = new URLSearchParams(location.search);
const voltarSacola = q.get('voltar') === 'sacola';
let MODO = q.get('modo') === 'cadastro' ? 'cadastro' : 'entrar', RECUPERANDO = /type=recovery/.test(location.hash), CONTA = null;
const traduz = (m) => {
  m = String(m || '');
  if (/Invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/Email not confirmed/i.test(m)) return 'Confirme seu e-mail primeiro: enviamos um link para a sua caixa de entrada.';
  if (/already registered|already been registered/i.test(m)) return 'Esse e-mail já tem conta. Use "Entrar" ou "Esqueci minha senha".';
  if (/at least 6|Password should/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (/rate limit|too many/i.test(m)) return 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.';
  if (/invalid.*email|Unable to validate email/i.test(m)) return 'Confira o e-mail digitado.';
  return m || 'Algo deu errado. Tente de novo.';
};
const seguir = () => { if (voltarSacola) location.href = 'index.html#sacola'; };

const SEG = `<p class="seg1"><svg class="i"><use href="#i-cadeado"/></svg>Seus dados são criptografados e protegidos.</p>`;
function telaAuth(msg = '', tipo = 'er') {
  app.className = 'mini-w';
  const tit = MODO === 'cadastro' ? 'Criar conta' : MODO === 'esqueci' ? 'Recuperar senha' : 'Entrar';
  const sub = MODO === 'esqueci' ? 'Enviaremos um link para o seu e-mail.' : 'Endereços salvos e seus pedidos em um só lugar.';
  app.innerHTML = `<section class="acard">
      <h2 class="at">${tit}</h2><p class="as">${sub}</p>
      ${MODO !== 'esqueci' ? `<div class="tabs"><button class="${MODO === 'entrar' ? 'on' : ''}" data-modo="entrar">Entrar</button><button class="${MODO === 'cadastro' ? 'on' : ''}" data-modo="cadastro">Criar conta</button></div>` : ''}
      <form id="fa" novalidate>
        ${MODO === 'cadastro' ? '<input class="in" name="nome" autocomplete="name" placeholder="Seu nome" aria-label="Seu nome" required><input class="in" name="tel" inputmode="tel" autocomplete="tel" placeholder="WhatsApp com DDD" aria-label="WhatsApp com DDD" required><input class="in" name="cpf" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="CPF" aria-label="CPF" required>' : ''}
        <input class="in" name="email" type="email" autocomplete="email" inputmode="email" placeholder="E-mail" aria-label="E-mail" required>
        ${MODO !== 'esqueci' ? `<span class="fi"><input class="in" name="senha" type="password" autocomplete="${MODO === 'cadastro' ? 'new-password' : 'current-password'}" required minlength="6" placeholder="${MODO === 'cadastro' ? 'Senha (mínimo 6 caracteres)' : 'Senha'}" aria-label="Senha"><button type="button" class="olho" data-olho aria-label="Mostrar senha"><svg class="i"><use href="#i-olho"/></svg></button></span>` : ''}
        ${MODO === 'entrar' ? '<button type="button" class="link r" data-modo="esqueci">Esqueci minha senha</button>' : ''}
        <div class="msg ${tipo}" id="am">${msg}</div>
        <button class="btn solid" id="ab">${MODO === 'cadastro' ? 'Criar conta' : MODO === 'esqueci' ? 'Enviar link' : 'Entrar'}</button>
        ${MODO === 'esqueci' ? '<button type="button" class="link" data-modo="entrar">Voltar</button>' : ''}
      </form>
      ${SEG}
    </section>
    <a class="alogo" href="index.html"><img src="img/logo_mlz_company.png" alt="MLZ Company"></a>`;
  app.querySelector('#fa').onsubmit = enviarAuth;
  const sn = app.querySelector('#fa [name=senha]'), fz = document.getElementById('forca');
  if (sn && fz) sn.addEventListener('input', () => {
    const v = sn.value; let n = 0; if (v.length >= 6) n++; if (v.length >= 10) n++; if (/[A-Z]/.test(v) && /\d/.test(v) || /[^A-Za-z0-9]/.test(v)) n++;
    fz.dataset.n = v ? n : ''; fz.querySelector('span').textContent = !v ? '' : ['Muito curta', 'Senha fraca', 'Senha boa', 'Senha forte'][n];
  });
}
app.addEventListener('click', (e) => { const o = e.target.closest('[data-olho]'); if (!o) return; const i = o.parentNode.querySelector('input'); const ver = i.type === 'password'; i.type = ver ? 'text' : 'password'; o.innerHTML = `<svg class="i"><use href="#i-olho${ver ? '-x' : ''}"/></svg>`; o.setAttribute('aria-label', ver ? 'Esconder senha' : 'Mostrar senha'); });
app.addEventListener('click', (e) => { const b = e.target.closest('[data-modo]'); if (b) { MODO = b.dataset.modo; telaAuth(); } });

async function enviarAuth(e) {
  e.preventDefault(); const f = e.target, m = document.getElementById('am'), b = document.getElementById('ab');
  const email = f.email.value.trim(), senha = f.senha ? f.senha.value : '', nome = f.nome ? f.nome.value.trim() : '';
  m.className = 'msg er'; m.textContent = '';
  if (MODO === 'cadastro' && !nome) { m.textContent = 'Informe seu nome.'; return f.nome.focus(); }
  const tel = f.tel ? f.tel.value.trim() : '', cpf = f.cpf ? soDigitos(f.cpf.value) : '';
  if (MODO === 'cadastro' && soDigitos(tel).length < 10) { m.textContent = 'Informe seu WhatsApp com DDD.'; return f.tel.focus(); }
  if (MODO === 'cadastro' && !cpfOk(cpf)) { m.textContent = 'Confira o CPF digitado.'; return f.cpf.focus(); }
  if (!/^\S+@\S+\.\S+$/.test(email)) { m.textContent = 'Confira o e-mail digitado.'; return f.email.focus(); }
  if (MODO !== 'esqueci' && senha.length < 6) { m.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return f.senha.focus(); }
  b.disabled = true;
  try {
    if (MODO === 'esqueci') {
      await api.recuperarSenha(email);
      MODO = 'entrar'; return telaAuth('Se esse e-mail tiver conta, o link para criar a senha nova já está na sua caixa de entrada (confira o spam também).', 'ok');
    }
    if (MODO === 'cadastro') {
      const r = await api.cadastrar(email, senha, nome, { telefone: tel, cpf });
      if (!r.session) { MODO = 'entrar'; return telaAuth('Conta criada! Enviamos um link de confirmação para o seu e-mail. Clique nele e depois entre aqui.', 'ok'); }
      try { await api.salvarConta(nome, tel, null); } catch (_) {}
      try { await api.salvarCpf(cpf, tel); } catch (err) { console.error(err); }
    } else await api.entrar(email, senha);
    await abrirConta(true);
  } catch (err) { m.textContent = traduz(err.message); b.disabled = false; }
}

function telaNovaSenha(msg = '') {
  app.className = '';
  app.innerHTML = `<div class="auth"><h1>Criar senha nova</h1><p class="sub">Escolha a senha que você vai usar para entrar.</p>
    <div class="box"><form id="fn" novalidate><label>Senha nova<input class="in" name="senha" type="password" autocomplete="new-password" minlength="6" placeholder="Mínimo de 6 caracteres"></label>
    <div class="msg er" id="nm">${msg}</div><button class="btn solid">Salvar senha</button></form></div></div>`;
  app.querySelector('#fn').onsubmit = async (e) => {
    e.preventDefault(); const s = e.target.senha.value, m = document.getElementById('nm');
    if (s.length < 6) { m.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
    try { await api.trocarSenha(s); RECUPERANDO = false; history.replaceState(null, '', 'conta.html'); await abrirConta(); }
    catch (err) { m.textContent = traduz(err.message); }
  };
}

const ROT = { entrega: { pendente: ['Preparando o envio', 'b-wait'], enviado: ['Saiu para entrega', 'b-env'], entregue: ['Entregue', 'b-ok'] },
  retirada: { pendente: ['Separando o pedido', 'b-wait'], enviado: ['Pronto para retirar', 'b-env'], entregue: ['Retirado', 'b-ok'] } };
const CAMPOS = ['cep', 'rua', 'numero', 'complemento', 'bairro', 'cidade', 'uf', 'referencia'];

const fmtEnd = (e) => [[e.rua, e.numero, e.complemento].filter(Boolean).join(', '), e.bairro, [e.cidade, e.uf].filter(Boolean).join('/'), e.cep ? 'CEP ' + e.cep : ''].filter(Boolean).join(' - ');
let EDIT = null; // null = fechado, -1 = novo, n = editando o n-ésimo

let TAB = ['pedidos', 'enderecos', 'dados'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'pedidos', CFG = {};
const ETAPAS = { entrega: ['Pago', 'Preparando', 'Enviado', 'Entregue'], retirada: ['Pago', 'Separando', 'Pronto', 'Retirado'] };
const passo = (st) => ({ pendente: 1, enviado: 2, entregue: 3 }[st || 'pendente'] ?? 1);
const iniciais = (n) => String(n || '?').trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const mesAno = (d) => d ? new Date(d).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }) : '';
const linkWa = (t) => { const n = soDigitos(CFG.whatsapp); return n ? `https://wa.me/${n.length <= 11 ? '55' + n : n}?text=${encodeURIComponent(t)}` : ''; };
const andamento = (p) => p.entrega ? p.entrega_status !== 'entregue' : !p.pago;

const cpfOk = v => { const d = String(v || '').replace(/\D/g, ''); if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
  const dv = n => { let s = 0; for (let i = 0; i < n; i++) s += +d[i] * (n + 1 - i); const r = (s * 10) % 11; return r === 10 ? 0 : r; };
  return dv(9) === +d[9] && dv(10) === +d[10]; };
async function abrirConta(acabouDeEntrar) {
  app.className = 'dash';
  app.innerHTML = '<div class="load"><div class="spin"></div></div>';
  try { [CONTA, CFG] = await Promise.all([api.minhaConta(), api.config().catch(() => ({}))]); } catch (err) { console.error(err); CONTA = { compras: [], enderecos: [] }; }
  // conta criada com confirmação de e-mail: o CPF e o WhatsApp do cadastro ficam guardados e entram no 1º acesso (puxa o histórico pelo CPF)
  if (!CONTA.cpf) try {
    const ss = await api.sessao(), md = (ss && ss.user && ss.user.user_metadata) || {};
    if (md.cpf && cpfOk(md.cpf)) {
      if (md.telefone && !CONTA.telefone) try { await api.salvarConta(CONTA.nome || md.nome || 'Cliente', md.telefone, null); } catch (_) {}
      await api.salvarCpf(md.cpf, md.telefone || ''); CONTA = await api.minhaConta();
    }
  } catch (err) { console.error(err); }
  CONTA.enderecos = CONTA.enderecos || []; CONTA.compras = CONTA.compras || []; CONTA.pendentes = CONTA.pendentes || [];
  if (acabouDeEntrar && voltarSacola) return seguir();
  renderDash();
}

function renderDash() {
  const emAnd = CONTA.compras.filter(andamento).length;
  const tabs = [['pedidos', 'Pedidos'], ['enderecos', 'Endereços'], ['dados', 'Conta']];
  app.innerHTML = `
    <section class="dhero"><div class="dh"><h1>Olá${CONTA.nome ? ', ' + esc(CONTA.nome.split(' ')[0]) : ''}</h1><div class="em">${esc(CONTA.email || '')}</div></div>
      <button class="link" id="sair">Sair</button></section>
    ${CONTA.pendentes.map(p => `<div class="pend"><div class="gr">Pagamento pendente · <b>${brl(p.total)}</b></div><a class="btn solid sm" href="${esc(p.checkout_url)}">Pagar</a></div>`).join('')}
    <nav class="dtabs">${tabs.map(([k, l]) => `<button class="${TAB === k ? 'on' : ''}" data-tab="${k}">${l}${k === 'pedidos' && emAnd ? ` <em>${emAnd}</em>` : ''}</button>`).join('')}</nav>
    <div id="tabc"></div>`;
  document.getElementById('sair').onclick = async () => { await api.sair(); CONTA = null; MODO = 'entrar'; telaAuth(); };
  renderTab();
}

function htmlPedido(p) {
  const n = p.pedido ? '#' + p.pedido : '#V' + p.id, et = p.entrega ? ETAPAS[p.entrega] : null, k = et ? passo(p.entrega_status) : 0;
  const r = p.entrega ? ROT[p.entrega][p.entrega_status || 'pendente'] : null;
  const prods = (p.itens || []).filter(i => i.produto_id), img = (p.itens || []).find(i => i.imagem);
  return `<article class="ped">
    <div class="pt">${img ? `<img src="${esc(img.imagem)}" alt="" loading="lazy">` : ''}
      <div class="gr"><b>${(p.itens || []).map(i => `${i.quantidade > 1 ? i.quantidade + '× ' : ''}${esc(i.descricao)}`).join(', ')}</b>
        <div class="m">${n} · ${dataBR(p.data)} · ${brl(p.total)}</div></div>
      <span class="badge ${r ? r[1] : p.pago ? 'b-ok' : 'b-wait'}">${r ? r[0] : p.pago ? 'Pago' : 'Em aberto'}</span></div>
    ${et && k < 3 ? `<div class="bar"><i style="width:${(k / 3) * 100}%"></i></div><div class="barl">${et.map((e, i) => `<span class="${i <= k ? 'ok' : ''}">${e}</span>`).join('')}</div>` : ''}
    ${p.entrega === 'retirada' && p.entrega_status !== 'entregue' && CFG.retirada_endereco ? `<div class="ret">Retire em ${esc(CFG.retirada_endereco)}${CFG.retirada_horario ? ' · ' + esc(CFG.retirada_horario) : ''}</div>` : ''}
    <div class="pa">${prods.length ? `<button class="link" data-denovo="${p.id}">Comprar de novo</button>` : ''}${p.recibo ? `<a class="link" href="${esc(p.recibo)}" target="_blank" rel="noopener">Comprovante</a>` : ''}</div>
  </article>`;
}

function renderTab() {
  const c = document.getElementById('tabc'); if (!c) return;
  document.querySelectorAll('.dtabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === TAB));
  if (TAB === 'pedidos') {
    const cs = CONTA.compras, and = cs.filter(andamento), fim = cs.filter(p => !andamento(p));
    c.innerHTML = cs.length ? [...and, ...fim].map(htmlPedido).join('')
      : `<div class="vazio grande">Nenhum pedido ainda.<a class="btn solid sm" href="index.html#colecao">Ver a coleção</a></div>`;
  } else if (TAB === 'enderecos') {
    c.innerHTML = '<div class="box" id="bEnd"></div>'; EDIT = null; renderEnderecos();
  } else {
    c.innerHTML = `<div class="box">
      <form id="fd" novalidate>
        <label>Nome<input class="in" name="nome" autocomplete="name" value="${esc(CONTA.nome || '')}"></label>
        <label>WhatsApp<input class="in" name="tel" inputmode="tel" autocomplete="tel" value="${esc(CONTA.telefone || '')}" placeholder="Com DDD"></label>
        <label>CPF<input class="in" name="cpf" inputmode="numeric" autocomplete="off" maxlength="14" value="${esc(CONTA.cpf || '')}" placeholder="Só números"></label>
        <div class="msg" id="dm"></div>
        <button class="btn solid">Salvar</button>
      </form></div>
      <details class="box sen"><summary>Trocar senha</summary>
      <form id="fs" novalidate>
        <span class="fi"><input class="in" name="s1" type="password" autocomplete="new-password" placeholder="Senha nova (mínimo 6)" aria-label="Senha nova"><button type="button" class="olho" data-olho aria-label="Mostrar senha"><svg class="i"><use href="#i-olho"/></svg></button></span>
        <div class="msg" id="sm"></div><button class="btn ghost">Salvar senha</button>
      </form></details>
      ${SEG}`;
    const f = document.getElementById('fd');
    f.onsubmit = async (ev) => {
      ev.preventDefault(); const m = document.getElementById('dm'); m.className = 'msg er';
      const nome = f.nome.value.trim(), tel = f.tel.value.trim();
      if (!nome) { m.textContent = 'Informe seu nome.'; return f.nome.focus(); }
      if (tel && soDigitos(tel).length < 10) { m.textContent = 'Informe o WhatsApp com DDD.'; return f.tel.focus(); }
      const cpf = soDigitos(f.cpf.value);
      if (cpf && !cpfOk(cpf)) { m.textContent = 'Confira o CPF digitado.'; return f.cpf.focus(); }
      try {
        await api.salvarConta(nome, tel, null); CONTA.nome = nome; CONTA.telefone = tel;
        let ligadas = 0;
        if (cpf && cpf !== soDigitos(CONTA.cpf || '')) { const r = await api.salvarCpf(cpf, tel); CONTA.cpf = r.cpf; ligadas = r.ligadas || 0; }
        m.className = 'msg ok'; m.textContent = ligadas ? `Salvo! Encontramos ${ligadas} compra${ligadas > 1 ? 's' : ''} sua${ligadas > 1 ? 's' : ''} com esse CPF.` : 'Salvo!';
        if (ligadas) setTimeout(() => abrirConta(), 1200);
      }
      catch (err) { m.textContent = traduz(err.message); }
    };
    const g = document.getElementById('fs');
    g.onsubmit = async (ev) => {
      ev.preventDefault(); const m = document.getElementById('sm'); m.className = 'msg er';
      if (g.s1.value.length < 6) { m.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return g.s1.focus(); }
      try { await api.trocarSenha(g.s1.value); g.reset(); m.className = 'msg ok'; m.textContent = 'Senha trocada!'; }
      catch (err) { m.textContent = traduz(err.message); }
    };
  }
}
app.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-tab]'); if (t) { TAB = t.dataset.tab; history.replaceState(null, '', '#' + TAB); return renderTab(); }
  const d = ev.target.closest('[data-denovo]'); if (!d) return;
  const p = CONTA.compras.find(x => x.id === +d.dataset.denovo); if (!p) return;
  let sac = []; try { sac = JSON.parse(localStorage.getItem('mlz_sacola') || '[]'); } catch (_) {}
  for (const i of p.itens.filter(i => i.produto_id)) { const j = sac.find(x => x.id === +i.produto_id); if (j) j.qtd += i.quantidade; else sac.push({ id: +i.produto_id, qtd: i.quantidade }); }
  try { localStorage.setItem('mlz_sacola', JSON.stringify(sac)); } catch (_) {}
  location.href = 'index.html#sacola';
});

function renderEnderecos(msg = '', tipo = 'ok') {
  const L = CONTA.enderecos, box = document.getElementById('bEnd'); if (!box) return;
  const e = EDIT === null ? null : EDIT === -1 ? {} : L[EDIT];
  box.innerHTML = `<h2><svg class="i"><use href="#i-pin"/></svg>Meus endereços</h2>
    ${L.length ? L.map((x, i) => `<div class="end ${EDIT === i ? 'ed' : ''}"><div class="gr"><div class="n">${esc(x.apelido || 'Endereço ' + (i + 1))}${i === 0 ? ' <span class="badge b-ok">Principal</span>' : ''}</div><div class="m">${esc(fmtEnd(x))}</div></div>
      <div class="eacts"><button type="button" class="mini" data-eed="${i}">Editar</button>${i ? `<button type="button" class="mini" data-epr="${i}">Tornar principal</button>` : ''}<button type="button" class="mini red" data-edel="${i}">Excluir</button></div></div>`).join('')
      : '<div class="vazio">Nenhum endereço salvo ainda.</div>'}
    <div class="msg ${tipo}" id="em">${msg}</div>
    ${e ? `<form id="fe" class="fend" novalidate>
      <h3>${EDIT === -1 ? 'Novo endereço' : 'Editar endereço'}</h3>
      <label>Nome do endereço<input class="in" name="apelido" maxlength="40" value="${esc(e.apelido || '')}" placeholder="Ex.: Casa, Trabalho, Casa da mãe"></label>
      <div class="row"><label>CEP<input class="in" name="cep" inputmode="numeric" autocomplete="postal-code" maxlength="9" value="${esc(e.cep || '')}"></label>
      <label>Número<input class="in" name="numero" value="${esc(e.numero || '')}"></label></div>
      <label>Rua<input class="in" name="rua" autocomplete="address-line1" value="${esc(e.rua || '')}"></label>
      <div class="row"><label>Complemento<input class="in" name="complemento" value="${esc(e.complemento || '')}" placeholder="Opcional"></label>
      <label>Bairro<input class="in" name="bairro" value="${esc(e.bairro || '')}"></label></div>
      <div class="row r3"><label>Cidade<input class="in" name="cidade" autocomplete="address-level2" value="${esc(e.cidade || '')}"></label>
      <label>UF<input class="in" name="uf" maxlength="2" autocomplete="address-level1" value="${esc(e.uf || '')}"></label></div>
      <label>Ponto de referência<input class="in" name="referencia" value="${esc(e.referencia || '')}" placeholder="Opcional"></label>
      <div class="msg er" id="fem"></div>
      <div class="acts"><button class="btn solid">Salvar endereço</button><button type="button" class="btn ghost" data-ecanc>Cancelar</button></div>
    </form>` : (L.length < 10 ? '<button type="button" class="btn ghost sm" data-enovo style="margin-top:12px">+ Adicionar endereço</button>' : '')}`;
  const fe = document.getElementById('fe'); if (!fe) return;
  fe.cep.addEventListener('input', async () => {
    let c = soDigitos(fe.cep.value).slice(0, 8); fe.cep.value = c.length > 5 ? c.slice(0, 5) + '-' + c.slice(5) : c;
    if (c.length !== 8 || fe.cep.dataset.ok === c) return; fe.cep.dataset.ok = c;
    try { const d = await (await fetch(`https://viacep.com.br/ws/${c}/json/`)).json(); if (d.erro) { document.getElementById('fem').textContent = 'CEP não encontrado. Confira ou preencha à mão.'; return; }
      document.getElementById('fem').textContent = '';
      if (d.logradouro) fe.rua.value = d.logradouro; if (d.bairro) fe.bairro.value = d.bairro; if (d.localidade) fe.cidade.value = d.localidade; if (d.uf) fe.uf.value = d.uf;
      (d.logradouro ? fe.numero : fe.rua).focus(); } catch (_) {}
  });
  fe.onsubmit = async (ev) => {
    ev.preventDefault(); const m = document.getElementById('fem');
    const n = { id: e.id || '', apelido: fe.apelido.value.trim() }; CAMPOS.forEach(k => n[k] = fe[k].value.trim()); n.uf = n.uf.toUpperCase();
    const falta = [['cep', 'o CEP'], ['rua', 'a rua'], ['numero', 'o número'], ['bairro', 'o bairro'], ['cidade', 'a cidade'], ['uf', 'o estado (UF)']].find(([k]) => !n[k] || (k === 'cep' && soDigitos(n.cep).length !== 8));
    if (falta) { m.textContent = `Informe ${falta[1]}.`; return fe[falta[0]].focus(); }
    const L2 = [...L]; if (EDIT === -1) L2.push(n); else L2[EDIT] = n;
    await gravar(L2, 'Endereço salvo!');
  };
}
async function gravar(lista, ok) {
  try { CONTA.enderecos = await api.salvarEnderecos(lista); EDIT = null; renderEnderecos(ok); }
  catch (err) { const m = document.getElementById('fem') || document.getElementById('em'); m.className = 'msg er'; m.textContent = traduz(err.message); }
}
app.addEventListener('click', async (ev) => {
  const b = ev.target.closest('[data-eed],[data-epr],[data-edel],[data-enovo],[data-ecanc]'); if (!b || !CONTA) return;
  const L = CONTA.enderecos;
  if (b.dataset.enovo !== undefined) { EDIT = -1; renderEnderecos(); return document.querySelector('#fe [name=apelido]').focus(); }
  if (b.dataset.ecanc !== undefined) { EDIT = null; return renderEnderecos(); }
  if (b.dataset.eed) { EDIT = +b.dataset.eed; renderEnderecos(); return document.getElementById('fe').scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  if (b.dataset.epr) { const i = +b.dataset.epr; return gravar([L[i], ...L.filter((_, k) => k !== i)], 'Endereço principal atualizado!'); }
  if (b.dataset.edel) { const i = +b.dataset.edel; if (!confirm(`Excluir o endereço "${L[i].apelido || fmtEnd(L[i])}"?`)) return; return gravar(L.filter((_, k) => k !== i), 'Endereço excluído.'); }
});

(async () => {
  let s = null; try { s = await api.sessao(); } catch (_) {}
  api.aoMudarLogin && api.aoMudarLogin((ev) => { if (ev === 'PASSWORD_RECOVERY') { RECUPERANDO = true; telaNovaSenha(); } });
  if (s && RECUPERANDO) return telaNovaSenha();
  if (s) return abrirConta();
  const erroUrl = new URLSearchParams(location.hash.slice(1)).get('error_description');
  telaAuth(erroUrl ? 'O link expirou ou já foi usado. Peça um novo.' : '');
})();
